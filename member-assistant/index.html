<script>
(() => {
  "use strict";

  const $ = (sel, scope = document) => scope.querySelector(sel);
  const root = document.documentElement;
  const app = $("#app"), page = $("#page"), flow = $("#flow"), chipsEl = $("#chips"), statusEl = $("#status");
  const bar = $("#bar"), input = $("#message"), sendBtn = $("#send"), avatarBtn = $("#avatarBtn"), homeBtn = $("#home");
  const avatarEl = $("#avatar"), eyeL = $("#eyeL"), eyeR = $("#eyeR");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const pace = (ms) => (reduceMotion.matches ? Math.min(ms, 120) : ms);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$" + n.toLocaleString("en-US");

  /* =========================================================
     1. SAMPLE DATA  (all made up)
     ========================================================= */

  const MEMBER = { first: "Jamie", name: "Jamie Rivera", id: "MBR 4821 0937 01", group: "0845 21", plan: "Standard PPO" };
  const USAGE = { deductible: [850, 1500], oop: [1320, 4000] };

  const SPECIALTIES = [
    { key: "derm",    label: "Dermatology",      noun: "dermatologists",       one: "a dermatologist",       re: /dermatolog|skin|rash|acne|mole/, reason: "Skin check",     pay: [50, 25] },
    { key: "pt",      label: "Physical therapy", noun: "physical therapists",  one: "a physical therapist",  re: /physical therap|physio|\bpt\b/,   reason: "First visit",    pay: [40, 40] },
    { key: "ortho",   label: "Orthopedics",      noun: "bone and joint doctors", one: "a bone and joint doctor", re: /ortho|knee|shoulder|joint|sprain|bone|ankle/, reason: "Joint pain", pay: [50, 25] },
    { key: "therapy", label: "Mental health",    noun: "therapists",           one: "a therapist",           re: /therap|counsel|mental|anxi|depress|psych|stress/, reason: "First session", pay: [25, 10] },
    { key: "eye",     label: "Eye care",         noun: "eye doctors",          one: "an eye doctor",         re: /\beye|vision|optom|glasses|contacts/, reason: "Eye exam",   pay: [50, 50] },
    { key: "primary", label: "Primary care",     noun: "primary care doctors", one: "a primary care doctor", re: /primary|pcp|family doctor|check-?up|physical|my doctor|flu|cold|sick|cough/, reason: "General visit", pay: [25, 10] },
  ];
  const SPEC = Object.fromEntries(SPECIALTIES.map((s) => [s.key, s]));

  const DOCS = {
    primary: [["Dr. Maya Chen", "Riverside Family Clinic", "210 Alder St", "1.2 mi"], ["Dr. Samuel Okafor", "Northgate Medical", "88 Pine Ave", "2.4 mi"], ["Dr. Elena Park", "Lakeview Primary Care", "5 Shore Rd", "3.1 mi"]],
    derm:    [["Dr. Luis Ortega", "Clearwater Dermatology", "14 Birch Ln", "1.8 mi"], ["Dr. Hannah Brooks", "Cedar Skin Clinic", "301 Elm St", "2.9 mi"], ["Dr. Arjun Mehta", "Uptown Dermatology", "77 Market St", "4.0 mi"]],
    pt:      [["Nora Whitfield, PT", "Stride Physical Therapy", "42 Mill Rd", "0.9 mi"], ["Daniel Reyes, PT", "Motion Lab", "160 Grove St", "2.2 mi"], ["Priya Nair, PT", "Summit Rehab", "9 Hilltop Dr", "3.6 mi"]],
    ortho:   [["Dr. Grace Lin", "Harbor Orthopedics", "120 Dock St", "2.0 mi"], ["Dr. Marcus Hale", "Peak Bone and Joint", "33 Ridge Rd", "3.3 mi"], ["Dr. Sofia Alvarez", "Central Ortho Group", "400 Main St", "4.4 mi"]],
    therapy: [["Dana Kim, LCSW", "Open Door Counseling", "18 Willow Way", "1.5 mi"], ["Dr. Omar Haddad", "Still Water Therapy", "250 Oak St", "2.7 mi"], ["Rachel Stone, LMFT", "Bright Path Counseling", "6 Garden Ct", "3.8 mi"]],
    eye:     [["Dr. Irene Novak", "Clear View Eye Care", "55 Lake St", "1.1 mi"], ["Dr. Theo Grant", "Focus Optometry", "210 Park Ave", "2.5 mi"], ["Dr. Amara Diallo", "Bayside Eye Clinic", "12 Pier Rd", "3.9 mi"]],
  };
  const docsFor = (key) => DOCS[key].map(([name, place, addr, dist], i) => ({ name, place, addr, dist, spec: key, i }));
  const initials = (name) => name.replace(/^Dr\.\s+/, "").replace(/,.*$/, "").split(/\s+/).map((p) => p[0]).slice(0, 2).join("");

  const REASONS = [
    [/knee/, "Knee pain"], [/shoulder/, "Shoulder pain"], [/ankle/, "Ankle pain"], [/\bback (pain|hurts|ache)|\bmy back\b|backache/, "Back pain"],
    [/rash/, "Skin rash"], [/acne/, "Acne"], [/mole/, "Mole check"],
    [/check-?up|annual|yearly|physical(?! therap)/, "Yearly checkup"],
    [/vaccine|flu shot/, "Vaccine"], [/cold|flu|cough|sore throat|fever/, "Cold or flu"],
    [/anxi|stress/, "Stress and anxiety"], [/glasses|vision|eye exam/, "Eye exam"], [/headache|migraine/, "Headaches"],
  ];

  const BENEFITS = [
    { re: /physical therap|physio|\bpt\b/, name: "Physical therapy", covered: true, pay: "$40 per visit", note: "This is your copay. You do not need to meet your deductible first.", limit: ["Visits used this year", 4, 30], approval: "Not needed for your first 12 visits", spec: "pt" },
    { re: /\bmri\b|\bct\b|scan|imaging|x-?ray/, name: "MRI and CT scans", covered: true, pay: "20% after your deductible", note: "You still have $650 left on your deductible, and you pay that first. Ask me what an MRI will cost you.", approval: "Needed first. Your doctor sends the request.", warn: true, next: "What will an MRI cost?" },
    { re: /acupunct/, name: "Acupuncture", covered: false, pay: "Full price", note: "Your plan does not pay for this. You can use HSA or FSA money for it." },
    { re: /massage/, name: "Massage therapy", covered: false, pay: "Full price", note: "Your plan does not pay for this unless it is part of physical therapy." },
    { re: /mental|counsel|psych|therapist|(^|is |for |my |does )therapy/, name: "Mental health visits", covered: true, pay: "$25 per visit", note: "Same price in person. Video visits are $10.", approval: "Not needed", spec: "therapy" },
    { re: /urgent care/, name: "Urgent care", covered: true, pay: "$75 per visit", note: "An emergency room visit is $250, so urgent care can save you money when it is not an emergency.", approval: "Not needed" },
    { re: /emergency room|\ber\b/, name: "Emergency room", covered: true, pay: "$250 per visit", note: "Covered at any hospital, in network or not. The copay is dropped if you are admitted.", approval: "Never needed in an emergency" },
    { re: /video|telehealth|virtual/, name: "Video visits", covered: true, pay: "$10 per visit", note: "Available every day, usually within 15 minutes.", approval: "Not needed" },
    { re: /dermatolog|skin/, name: "Dermatology visits", covered: true, pay: "$50 per visit", note: "This is your specialist copay.", approval: "No referral needed", spec: "derm" },
    { re: /primary care|pcp|family doctor/, name: "Primary care visits", covered: true, pay: "$25 per visit", note: "Yearly checkups are $0. Video visits are $10.", approval: "Not needed", spec: "primary" },
    { re: /orthop|bone and joint/, name: "Orthopedic visits", covered: true, pay: "$50 per visit", note: "This is your specialist copay.", approval: "No referral needed", spec: "ortho" },
    { re: /eye care|eye exam|eye doctor|vision/, name: "Eye care visits", covered: true, pay: "$50 per visit", note: "This is your specialist copay.", approval: "No referral needed", spec: "eye" },
  ];

  // prices the plan has agreed to, used for cost estimates
  const ESTIMATES = [
    { re: /\bmri\b|scan|imaging/, name: "MRI of the knee", needsApproval: true, places: [
      { name: "Lakeside Imaging Center", dist: "2.1 mi", price: 900 },
      { name: "City General Hospital", dist: "3.4 mi", price: 1800 },
    ] },
  ];

  /* =========================================================
     2. THE "BRAIN"
     understand(text) turns what the member typed into a small UI spec:
       { say: "one or two short sentences", ui: [{ type, props }], next: ["follow up", ...] }
     Here it is simple keyword matching. To make it real, replace this
     function with a call to your model and have it return the same shape.
     The page only ever draws card types it knows (see MODULES below).
     ========================================================= */

  const HOME_CHIPS = ["Schedule a visit", "What will an MRI cost?", "Is physical therapy covered?", "Find a dermatologist", "Where is my claim?", "Show my ID card", "Talk to a person"];

  // the member's part of a price: the rest of the deductible first, then 20% of what is left
  function yourShare(price) {
    const left = Math.max(0, USAGE.deductible[1] - USAGE.deductible[0]);
    const toDeductible = Math.min(price, left);
    const share = Math.round((price - toDeductible) * 0.2);
    return { price, toDeductible, rest: price - toDeductible, share, you: toDeductible + share, plan: price - toDeductible - share };
  }

  function findSpecialty(t) { return SPECIALTIES.find((s) => s.re.test(t)) || null; }
  function findDoctor(t) {
    for (const key of Object.keys(DOCS)) for (const d of docsFor(key)) {
      const [first, last] = d.name.replace(/^Dr\.\s+/, "").replace(/,.*$/, "").toLowerCase().split(" ");
      if (new RegExp("\\b(dr\\.?|doctor|with|" + first + ") " + last + "\\b").test(t)) return d;
    }
    return null;
  }

  // Safety words. These are checked first and always win, even when a draft card is open.
  // A real product needs much more than a word list here. This is only a stand-in.
  const CRISIS = /suicid|kill(ing)? myself|hurt(ing)? myself|self.?harm|end(ing)? (my life|it all)|want to die|(don.?t|do not) want to (live|be here|be alive)|take my (own )?life/;
  const SYMPTOMS = /chest (pain|hurt|tight|pressure|is tight)|heart attack|(can.?t|cannot|can not|hard to|not|stopped) breath|trouble breathing|short of breath|stroke|overdose|(took|taken|had|swallowed) too (many|much)|too many pills|swallowed|poison(?! ivy| oak)|bleeding|unconscious|passed out|seizure|choking|severe/;
  function urgency(text) {
    const t = String(text).toLowerCase();
    if (CRISIS.test(t)) return "crisis";
    if (SYMPTOMS.test(t)) return "emergency";
    // "is the emergency room covered?" is a money question, not an emergency
    const aboutTheER = /emergency room|\ber\b/.test(t) && /cover|cost|how much|copay|price|pay/.test(t);
    if (/emergency|\b911\b/.test(t) && !aboutTheER) return "emergency";
    return null;
  }
  const isUrgent = (text) => urgency(text) !== null;

  function understand(text) {
    const t = text.toLowerCase().trim();

    // safety first
    const urgent = urgency(t);
    if (urgent === "crisis")
      return { say: "I am really glad you told me. You do not have to handle this alone. You can call or text 988 right now and talk to someone.", ui: [{ type: "urgent", props: { crisis: true } }], next: ["Talk to a person"] };
    if (urgent === "emergency")
      return { say: "If this could be an emergency, call 911 now. If it can wait a little, here are fast ways to get care.", ui: [{ type: "urgent", props: { poison: /swallow|poison|too (many|much)|overdose/.test(t) } }], next: ["Find urgent care near me", "Talk to a person"] };

    // how it sounds. This is a setting for whoever runs the prototype, not a member feature
    if (/\bvoice (settings?|set ?up|options?)\b|\b(change|pick|choose|set ?up|switch) (your |the |a |my )?voice\b|natural voice|eleven ?labs|how you sound/.test(t))
      return { say: "Here is how I sound. You can pick a more natural voice.", ui: [{ type: "voice", props: {} }], next: HOME_CHIPS };

    if (/id card|member id|insurance card|my card|member number/.test(t))
      return { say: "Here is your member ID card. You can show this at any visit.", ui: [{ type: "idcard", props: {} }], next: ["Schedule a visit", "My deductible"] };

    if (/what is a deductible|what does deductible mean/.test(t))
      return { say: "A deductible is the amount you pay for care each year before your plan starts to share the cost. Checkups and other preventive care are $0 even before you reach it.", ui: [], next: ["My deductible", "Is physical therapy covered?"] };
    if (/deductible|out.of.pocket|how much have i (paid|spent|met)|my spending/.test(t)) {
      const left = USAGE.deductible[1] - USAGE.deductible[0];
      return { say: `You have paid ${money(USAGE.deductible[0])} of your ${money(USAGE.deductible[1])} deductible. After ${money(left)} more, your plan starts paying most of the bill.`, ui: [{ type: "usage", props: {} }], next: ["What is a deductible?", "Where is my claim?"] };
    }

    if (/prior auth|pre.?auth|authoriz|approval status|approved|my approval|waiting (for|on) approval/.test(t))
      return { say: "Your MRI request is with your plan now. You do not need to do anything. A decision is due within a week.", ui: [{ type: "approval", props: {} }], next: ["What will an MRI cost?", "Talk to a person"] };

    if (/how much|cost|price|estimate|what will i (pay|owe)/.test(t)) {
      const e = ESTIMATES.find((x) => x.re.test(t));
      if (e) {
        const low = Math.min(...e.places.map((pl) => yourShare(pl.price).you));
        return { say: `An MRI would cost you about ${money(low)} at the lower priced place near you. Here is how I got that number.`, ui: [{ type: "cost", props: { estimate: e } }], next: ["Is my MRI approved?", "My deductible", "Find a bone and joint doctor"] };
      }
    }

    if (/looks wrong|is wrong|complain|appeal|dispute/.test(t))
      return { say: "Sure. I can have a person call you. I will pass along what we talked about so you do not have to repeat it.", ui: [{ type: "handoff", props: { topic: "A problem with a claim" } }], next: ["Where is my claim?", "Show my ID card"] };

    if (/claim|\bbill|\beob\b|charged|\bowe\b/.test(t))
      return claimPaid ? { say: "Your latest claim is paid in full. You do not owe anything.", ui: [{ type: "claim", props: {} }], next: ["My deductible", "Show my ID card"] } : { say: "Your latest claim is finished. Your plan paid its part and you owe $25.", ui: [{ type: "claim", props: {} }], next: ["Something looks wrong", "My deductible"] };

    if (/refill|prescription|medication|medicine|\brx\b|pharmacy/.test(t))
      return { say: "You have one refill ready. Check the details and confirm, and I will send it to the pharmacy.", ui: [{ type: "refill", props: {} }], next: ["Show my ID card", "My deductible"] };

    const doctor = findDoctor(t);
    const wantsBooking = /schedul|book|appointment|appt|make a visit|set up a visit|see (a|an|my|the) |see some(one|body)|get seen|looked at|checked out|visit with|check-?up|get in to see/.test(t);
    // said the way people talk: "my knee has been hurting". A problem we know, and no other question in the sentence
    const ailing = !wantsBooking && /hurt|pain|ache|aching|sore|sick|rash|cough|fever|migraine|bothering/.test(t) && REASONS.some(([re]) => re.test(t)) &&
      !/cover|cost|price|how much|pay|find|look for|near me|claim|bill|refill|approv/.test(t);
    if (doctor || wantsBooking || ailing) {
      const spec = doctor ? SPEC[doctor.spec] : findSpecialty(t) || SPEC.primary;
      const doc = doctor || docsFor(spec.key)[0];
      const found = REASONS.find(([re]) => re.test(t));
      const reason = found ? found[1] : spec.reason;
      const video = /video|virtual|online|telehealth/.test(t);
      const days = upcomingWeekdays(5);
      let day = doctor ? doctor.i : 0, dayAsked = "";
      const names = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
      names.forEach((n, i) => { if (t.includes(n)) { const k = days.findIndex((d) => d.getDay() === i); if (k >= 0) { day = k; dayAsked = n[0].toUpperCase() + n.slice(1); } } });
      if (/next week/.test(t)) { const k = days.findIndex((d, i) => i > 0 && d.getDay() === 1); if (k >= 0) day = k; }
      const slot = /afternoon|after work|evening|late/.test(t) ? 2 : /noon|lunch|midday/.test(t) ? 1 : 0;
      const about = found ? ` about ${reason.toLowerCase()}` : "";
      const kind = video ? "video visit" : "visit";
      const sorry = ailing ? "Sorry to hear that. " : "";
      const say = sorry + (dayAsked
        ? `I found a ${kind} with ${doc.name} on ${dayAsked}${about}. Check the details, change anything, then confirm.`
        : `Here is the soonest ${kind} with ${doc.name}${about}. Check the details, change anything, then confirm.`);
      return { say, ui: [{ type: "schedule", props: { doc, reason, video, day, slot } }], next: [video ? "In person instead" : "Video instead", "A day later", "Morning works better", `Find another ${spec.one.replace(/^an? /, "")}`] };
    }

    if (/find|look for|search|near me|in.?network|who can i see|need (a|an) /.test(t)) {
      if (/urgent care/.test(t))
        return { say: "Here are the fastest ways to get care today. None of these need an appointment.", ui: [{ type: "urgent", props: { calm: true } }], next: ["Is urgent care covered?", "Talk to a person"] };
      const spec = findSpecialty(t) || SPEC.primary;
      return { say: `I found 3 ${spec.noun} near you. All of them are in your network, so you pay the lower price.`, ui: [{ type: "providers", props: { spec: spec.key } }], next: [`Is ${spec.label.toLowerCase()} covered?`, "Show my ID card"] };
    }

    if (/cover|pay for|how much|cost|price|do i need (a referral|approval)|included/.test(t)) {
      const b = BENEFITS.find((x) => x.re.test(t));
      if (b) {
        const say = b.covered ? `Yes, ${b.name.replace(/^[A-Z](?=[a-z])/, (c) => c.toLowerCase())} ${/s$/.test(b.name) ? "are" : "is"} covered. Here is what you would pay.` : `${b.name} is not covered by your plan, so you would pay the full price.`;
        const next = [];
        if (b.next) next.push(b.next);
        next.push("Schedule a visit", "Talk to a person");
        return { say, ui: [{ type: "coverage", props: { benefit: b } }], next };
      }
      return { say: "I could not find that in your plan summary, and I do not want to guess. A person on our team can check it for you.", ui: [{ type: "handoff", props: { topic: text } }], next: ["Is physical therapy covered?", "Is an MRI covered?"] };
    }

    if (/talk to|speak (to|with)|call me|human|a person|real person|agent|representative|nurse|something looks wrong|complain|appeal/.test(t))
      return { say: "Sure. I can have a person call you. I will pass along what we talked about so you do not have to repeat it.", ui: [{ type: "handoff", props: { topic: /wrong|appeal|complain/.test(t) ? "A problem with a claim" : "" } }], next: ["Where is my claim?", "Show my ID card"] };

    if (/^(hi|hey|hello|yo|good (morning|afternoon|evening))\b/.test(t))
      return { say: `Hi ${MEMBER.first}. I am Carely. I can book visits, check what your plan covers, track claims and more. What do you need?`, ui: [], next: HOME_CHIPS };
    if (/thank/.test(t))
      return { say: "Any time. I am here if you need anything else.", ui: [], next: HOME_CHIPS };

    return { unknown: true, say: "I am not sure about that one yet. This is a prototype, so I only know a few things. Try one of these.", ui: [], next: HOME_CHIPS };
  }

  /* =========================================================
     3. CARDS ("modules")
     Each one takes props and returns a card element. Anything that
     changes something in the real world is a draft until the member
     confirms it.
     ========================================================= */

  const ICON = {
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 5 5.8v5.7c0 4.3 2.9 7.7 7 9.3 4.1-1.6 7-5 7-9.3V5.8z"/><path d="m9 12 2.2 2.2L15.2 10"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7.5L19 8v10.5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M9 12.5h6M9 16h4"/></svg>',
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="3.5"/><path d="M7 10.5h4M7 14h7"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16M7 16v-4M12 16V7M17 16v-6.5"/></svg>',
    pill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="8.5" width="18.4" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="m9.4 8.3 5.2 7.4"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h2.3l1.4 3.8-1.8 1.4a11 11 0 0 0 6.4 6.4l1.4-1.8 3.8 1.4v2.3a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 4.5 6.2a2 2 0 0 1 2-2.2z"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3.5 19h17z"/><path d="M12 10v4M12 16.8v.2"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.5 6.5l2.5 2.5M15 15l2.5 2.5M17.5 6.5 15 9M9 15l-2.5 2.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5.5 12.5 4.3 4.3 8.7-9.3"/></svg>',
    voice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.2 6.5a8 8 0 0 1 0 11"/></svg>',
  };

  let seq = 0;

  function shell(kind, icon, pill = "") {
    const el = document.createElement("section");
    const id = "mod" + (++seq);
    el.className = "mod";
    el.setAttribute("aria-labelledby", id);
    el.innerHTML =
      `<div class="mod__ghost" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
       <header class="mod__head"><h2 class="mod__kind" id="${id}">${icon}<span>${esc(kind)}</span></h2>${pill}</header>
       <div class="mod__body"></div>
       <div class="mod__actions"></div>`;
    return { el, id, body: $(".mod__body", el), actions: $(".mod__actions", el), pill: () => $(".pill", el) };
  }

  // number the parts so they arrive one after another
  function stagger(el) { el.querySelectorAll(".part").forEach((p, i) => p.style.setProperty("--i", i)); }

  // change a card's content and glide its height to the new size
  function morph(el, change) {
    const from = el.offsetHeight;
    change();
    stagger(el);
    if (reduceMotion.matches) return;
    const to = el.offsetHeight;
    if (from === to) return;
    el.style.height = from + "px";
    el.style.overflow = "hidden";
    el.offsetHeight;                               // lock in the start height
    el.style.transition = "height 0.45s cubic-bezier(0.22, 0.9, 0.3, 1)";
    el.style.height = to + "px";
    const done = () => { el.style.height = el.style.overflow = el.style.transition = ""; el.removeEventListener("transitionend", done); };
    el.addEventListener("transitionend", done);
    setTimeout(done, 600);
  }

  // after a card changes state its old buttons are gone, so put focus on the result
  function landFocus(card) {
    if (document.activeElement && document.activeElement !== document.body && document.activeElement.isConnected) return;
    const head = card.querySelector(".done") || card.querySelector(".mod__kind");
    if (!head) return;
    head.setAttribute("tabindex", "-1");
    head.focus({ preventScroll: true });
  }

  /* ---- dates ---- */
  function upcomingWeekdays(n) {
    const out = [], d = new Date();
    d.setHours(0, 0, 0, 0);
    while (out.length < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) out.push(new Date(d)); }
    return out;
  }
  const fmt = (d, o) => new Intl.DateTimeFormat("en-US", o).format(d);
  const SLOTS = [["9:00 AM", "10:30 AM", "2:15 PM"], ["8:30 AM", "11:00 AM", "3:45 PM"], ["9:45 AM", "1:00 PM", "4:30 PM"], ["10:00 AM", "12:15 PM", "2:45 PM"], ["8:15 AM", "11:30 AM", "4:00 PM"]];

  const MODULES = {};

  /* ---- appointment: draft, then confirm ---- */
  MODULES.schedule = (p, api) => {
    const m = shell("Appointment", ICON.cal, '<span class="pill">Draft</span>');
    const n = m.id, doc = p.doc, spec = SPEC[doc.spec], days = upcomingWeekdays(5);
    const st = { day: clamp(p.day || 0, 0, 4), slot: clamp(p.slot || 0, 0, 2), video: !!p.video };

    m.body.innerHTML =
      `<div class="who part"><span class="who__pic" aria-hidden="true">${esc(initials(doc.name))}</span>
         <span class="who__txt"><b>${esc(doc.name)}</b><span>${esc(spec.label)} · <em class="ok">In network</em></span></span></div>
       <div class="row part" data-row="reason"><label class="row__label" for="${n}-reason">Reason</label>
         <input class="inline-input" id="${n}-reason" type="text" maxlength="60" autocomplete="off" enterkeyhint="done" /></div>
       <div class="row row--stack part" data-row="day"><span class="row__label" id="${n}-dl">Day</span>
         <div class="opts opts--days" role="radiogroup" aria-labelledby="${n}-dl">${days.map((d, i) =>
           `<label class="opt"><input type="radio" name="${n}-day" value="${i}" aria-label="${esc(fmt(d, { weekday: "long", month: "long", day: "numeric" }))}"${i === st.day ? " checked" : ""} /><span><small>${fmt(d, { weekday: "short" })}</small><b>${d.getDate()}</b></span></label>`).join("")}</div></div>
       <div class="row row--stack part" data-row="time"><span class="row__label" id="${n}-tl">Time</span>
         <div class="opts" role="radiogroup" aria-labelledby="${n}-tl" data-times></div></div>
       <div class="row part" data-row="type"><span class="row__label" id="${n}-vl">Visit</span>
         <div class="opts opts--seg" role="radiogroup" aria-labelledby="${n}-vl">
           <label class="opt"><input type="radio" name="${n}-type" value="office"${st.video ? "" : " checked"} /><span>In person</span></label>
           <label class="opt"><input type="radio" name="${n}-type" value="video"${st.video ? " checked" : ""} /><span>Video</span></label></div></div>
       <div class="row part" data-row="where"><span class="row__label">Where</span><div class="row__val" data-where></div></div>
       <div class="row part" data-row="cost"><span class="row__label">You pay</span><div class="row__val"><b class="money" data-cost></b><span class="note" data-costnote></span></div></div>
       <p class="fine part">I picked the day and time for you. Tap anything to change it, or just tell me. Nothing is booked until you confirm.</p>`;
    m.actions.innerHTML =
      `<button class="btn btn--primary part" type="button" data-confirm></button>
       <button class="btn btn--text part" type="button" data-skip>Not now</button>`;

    const reasonEl = $(`#${n}-reason`, m.el);
    reasonEl.value = p.reason;
    const timesEl = $("[data-times]", m.el), whereEl = $("[data-where]", m.el), costEl = $("[data-cost]", m.el), noteEl = $("[data-costnote]", m.el), confirmBtn = $("[data-confirm]", m.el);

    const free = () => doc.spec === "primary" && /check-?up|annual|yearly|vaccine|flu shot/i.test(reasonEl.value);
    const cost = () => (free() ? 0 : spec.pay[st.video ? 1 : 0]);
    const when = () => `${fmt(days[st.day], { weekday: "short", month: "short", day: "numeric" })} at ${SLOTS[st.day][st.slot]}`;
    function drawTimes() {
      timesEl.innerHTML = SLOTS[st.day].map((s, i) =>
        `<label class="opt"><input type="radio" name="${n}-time" value="${i}"${i === st.slot ? " checked" : ""} /><span>${s}</span></label>`).join("");
    }
    function draw() {
      whereEl.innerHTML = st.video
        ? `<b>Video visit</b><span class="note">We will text you a link 10 minutes before.</span>`
        : `<b>${esc(doc.place)}</b><span class="note">${esc(doc.addr)} · ${esc(doc.dist)} away</span>`;
      costEl.textContent = money(cost());
      noteEl.textContent = free() ? "Yearly checkups and vaccines are $0 with your plan." : "This is your copay for the visit. Tests or treatment can cost extra.";
      confirmBtn.textContent = `Confirm ${fmt(days[st.day], { weekday: "short" })} ${SLOTS[st.day][st.slot]}`;
    }
    drawTimes(); draw();

    m.el.addEventListener("change", (e) => {
      const t = e.target;
      if (t.name === `${n}-day`) { st.day = +t.value; drawTimes(); }
      if (t.name === `${n}-time`) st.slot = +t.value;
      if (t.name === `${n}-type`) st.video = t.value === "video";
      draw();
    });
    reasonEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); reasonEl.blur(); } });
    reasonEl.addEventListener("input", draw);

    // lets the chat bar change this same card ("make it Thursday", "video instead")
    const check = (name, value) => { const r = m.el.querySelector(`input[name="${name}"][value="${value}"]`); if (r) r.checked = true; };
    const draft = {
      kind: "visit", open: true, el: m.el,
      state: () => ({ day: st.day, slot: st.slot, video: st.video, days }),
      describe: () => `${fmt(days[st.day], { weekday: "long" })} at ${SLOTS[st.day][st.slot]}${st.video ? ", by video" : ""}`,
      set(patch) {
        const changed = [];
        if (patch.day != null && clamp(patch.day, 0, 4) !== st.day) { st.day = clamp(patch.day, 0, 4); check(`${n}-day`, st.day); drawTimes(); changed.push("day", "time"); }
        if (patch.slot != null && clamp(patch.slot, 0, 2) !== st.slot) { st.slot = clamp(patch.slot, 0, 2); drawTimes(); changed.push("time"); }
        if (patch.video != null && patch.video !== st.video) { st.video = patch.video; check(`${n}-type`, st.video ? "video" : "office"); changed.push("type", "where", "cost"); }
        if (patch.reason && patch.reason !== reasonEl.value) { reasonEl.value = patch.reason; changed.push("reason"); }
        draw();
        [...new Set(changed)].forEach((name) => {
          const row = m.el.querySelector(`[data-row="${name}"]`);
          if (row) { row.classList.remove("flash"); row.offsetWidth; row.classList.add("flash"); }
        });
        return changed;
      },
      help: "I can change the day, the time of day, or switch to video. Try Thursday afternoon. Say confirm when it looks right.",
      readback: () => `${doc.name}, ${fmt(days[st.day], { weekday: "long" })} at ${SLOTS[st.day][st.slot]}, ${st.video ? "by video" : "in person"}. You pay ${money(cost())}. Is that right?`,
      costLine: () => `This visit would cost you ${money(cost())}. ${free() ? "Yearly checkups and vaccines are $0 with your plan." : "That is your copay."} Say confirm when it looks right.`,
      confirm: () => confirmBtn.click(),
      skip: () => $("[data-skip]", m.el).click(),
    };
    api.draft(draft);

    confirmBtn.addEventListener("click", () => {
      draft.open = false; api.draft(null);
      const reason = reasonEl.value.trim() || spec.reason;
      const whenText = when(), place = st.video ? "Video visit" : `${doc.place}, ${doc.addr}`, price = money(cost());
      const code = "V-" + String(48213 + seq * 37).slice(-5);
      morph(m.el, () => {
        m.pill().textContent = "Booked"; m.pill().className = "pill pill--ok";
        m.body.innerHTML =
          `<div class="done part"><span class="done__check" aria-hidden="true">${ICON.check}</span><div><b>You are booked</b><span>${esc(whenText)}</span></div></div>
           <div class="row part"><span class="row__label">With</span><div class="row__val"><b>${esc(doc.name)}</b><span class="note">${esc(spec.label)}</span></div></div>
           <div class="row part"><span class="row__label">Where</span><div class="row__val">${esc(place)}</div></div>
           <div class="row part"><span class="row__label">Reason</span><div class="row__val">${esc(reason)}</div></div>
           <div class="row part"><span class="row__label">You pay</span><div class="row__val"><b>${price}</b> at the visit</div></div>
           <p class="fine part">Confirmation ${code}. Bring your member ID card and arrive 10 minutes early.</p>`;
        m.actions.innerHTML =
          `<button class="btn btn--quiet part" type="button" data-ics>Add to calendar</button>
           <button class="btn btn--text part" type="button" data-cancel>Cancel this visit</button>`;
      });
      landFocus(m.el);
      $("[data-ics]", m.el).addEventListener("click", () => saveCalendarFile(days[st.day], SLOTS[st.day][st.slot], `Visit with ${doc.name}`, place, reason));
      $("[data-cancel]", m.el).addEventListener("click", (e) => {
        const btn = e.currentTarget;
        if (!btn.dataset.armed) {                 // first tap asks, second tap cancels
          btn.dataset.armed = "1";
          btn.textContent = "Yes, cancel this visit";
          btn.className = "btn btn--quiet part";
          btn.style.color = "var(--red-ink)";
          statusEl.textContent = "Press again to cancel this visit.";
          return;
        }
        morph(m.el, () => {
          m.el.classList.add("is-muted");
          m.pill().textContent = "Cancelled"; m.pill().className = "pill";
          m.actions.innerHTML = "";
          const d = $(".done b", m.el); if (d) d.textContent = "Visit cancelled";
        });
        landFocus(m.el);
        if (todayRow) todayRow.undo();
        api.say("Okay, I cancelled that visit. You will not be charged.", ["Schedule a visit", "Find another doctor"]);
      });
      api.celebrate(m.el);
      const todayRow = todayDone(/checkup/i.test(reason) ? "checkup" : "", "Visit booked", `${doc.name} · ${whenText}`);
      api.say(`Done. You are booked for ${whenText}. I will remind you the day before.`, ["Show my ID card", "My deductible"]);
    });

    $("[data-skip]", m.el).addEventListener("click", () => {
      draft.open = false; api.draft(null);
      morph(m.el, () => {
        m.el.classList.add("is-muted");
        m.pill().textContent = "Not booked";
        m.el.querySelectorAll("input").forEach((i) => (i.disabled = true));
        m.actions.innerHTML = "";
      });
      landFocus(m.el);
      api.say("No problem. Nothing was booked.", HOME_CHIPS);
    });
    return m.el;
  };

  /* ---- find care: a row of small cards ---- */
  MODULES.providers = (p, api) => {
    const spec = SPEC[p.spec], days = upcomingWeekdays(5);
    const strip = document.createElement("div");
    strip.className = "strip";
    strip.setAttribute("role", "list");
    strip.setAttribute("aria-label", `${spec.label} near you`);
    docsFor(p.spec).forEach((doc, i) => {
      const m = shell(doc.name, "", '<span class="pill pill--ok">In network</span>');
      m.el.setAttribute("role", "listitem");
      $(".mod__kind", m.el).classList.add("sr-only");
      m.el.style.animationDelay = `${i * 90}ms`;
      m.body.innerHTML =
        `<div class="who part"><span class="who__pic" aria-hidden="true">${esc(initials(doc.name))}</span>
           <span class="who__txt"><b>${esc(doc.name)}</b><span>${esc(doc.dist)} away</span></span></div>
         <div class="mini part"><span><b>${esc(doc.place)}</b></span><span>Next opening: ${fmt(days[i], { weekday: "short" })} at ${SLOTS[i][0]}</span><span>You pay ${money(spec.pay[0])} per visit</span></div>`;
      m.actions.innerHTML = `<button class="btn btn--quiet part" type="button">Book a visit</button>`;
      $("button", m.actions).addEventListener("click", () => api.ask(`Book a visit with ${doc.name}`));
      strip.appendChild(m.el);
    });
    return strip;
  };

  /* ---- is it covered? ---- */
  MODULES.coverage = (p, api) => {
    const b = p.benefit;
    const m = shell("Coverage", ICON.shield, b.covered ? '<span class="pill pill--ok">Covered</span>' : '<span class="pill pill--warn">Not covered</span>');
    const limit = b.limit ? `<div class="row part"><span class="row__label">Limit</span><div class="row__val"><b>${b.limit[1]} of ${b.limit[2]} visits used</b> this year<span class="note">${b.limit[2] - b.limit[1]} visits left</span><div class="meter" aria-hidden="true"><i data-fill="${(b.limit[1] / b.limit[2]) * 100}"></i></div></div></div>` : "";
    const approval = b.approval ? `<div class="row part"><span class="row__label">Approval</span><div class="row__val">${b.warn ? `<b style="color:var(--amber-ink)">${esc(b.approval)}</b>` : esc(b.approval)}</div></div>` : "";
    m.body.innerHTML =
      `<div class="verdict part"><b>${esc(b.name)}</b></div>

      if (!mine || saved || !m.el.isConnected || asked !== (key || "saved")) return;      // too late: the card moved on, or the key changed
      const want = voiceId();
      // the account's own voices come first. Of the ready made ones only library voices are kept: they can be used by ID
      list = mine.concat(now.voices.filter((v) => v.lib && !mine.some((x) => x.id === v.id)));
      if (picked !== "" && want && find(want)) picked = want;
      else if (picked !== "" && picked !== "other") { idEl.value = picked; picked = "other"; }
      const at = document.activeElement, keep = voicesEl.contains(at) || at === idEl;
      morph(m.el, () => { drawVoices(); draw(); });
      if (keep && (at !== idEl || idRow.hidden)) backToVoices();      // the list was redrawn under the keyboard focus, or the Voice ID box went away
    }
    loadMine("");

    // check what is on the card. Returns what to play, or null after saying what is missing
    function read() {
      const id = voiceId(), key = keyEl.value.trim();
      if (picked === "") return { id: "", key: "", style: "" };         // the phone's own voice needs nothing
      if (!id) { tell("Paste the voice ID first.", "bad", idEl); idEl.focus(); return null; }
      if (!/^[A-Za-z0-9]{8,40}$/.test(id)) { tell("That does not look like a voice ID. It is a short code of letters and numbers.", "bad", idEl); idEl.focus(); return null; }
      if (!key && !voice.natural.state().hasKey) { tell("Paste your ElevenLabs key first.", "bad", keyEl); keyEl.focus(); return null; }      // asked afresh: another card may have removed the key
      return { id, key, style };
    }
    let working = false;
    async function play(andSave) {
      if (working || saved) return;
      const pick = read();
      if (!pick) return;
      working = true;
      busyButtons(true);
      tell(pick.id ? "Getting the voice ready..." : "Playing...");
      const heard = await voice.natural.sample(pick.key, pick.id, pick.style);       // the tap that got us here is what lets a phone play sound
      if (!working) return;                               // the key was removed while the sample was on its way
      working = false;
      busyButtons(false);
      if (!heard.ok) { tell(heard.why + (andSave ? " Nothing was changed." : ""), "bad"); return; }
      if (!andSave) { tell("That is how it sounds.", "good"); return; }
      const aloud = when === "always" || !now.hears;
      voice.natural.save(pick.key, pick.id, pick.style, aloud);
      saved = true;
      flow.querySelectorAll('[data-row="key"] input').forEach((el) => { el.value = ""; });      // the key is not left sitting in the page, also not in an older Voice card
      const v = find(pick.id), name = !pick.id ? "The phone's own voice" : v ? `${v.name}, from ElevenLabs` : "Your ElevenLabs voice";
      morph(m.el, () => {
        m.pill().textContent = "Saved"; m.pill().className = "pill pill--ok";
        m.body.innerHTML = `<div class="done part" style="padding-bottom:4px"><span class="done__check" aria-hidden="true">${ICON.check}</span><div><b>Voice saved</b><span>${esc(name)}</span></div></div>`;
        m.actions.innerHTML = `<button class="btn btn--quiet part" type="button" data-again>Change it</button>`;
        $("[data-again]", m.el).addEventListener("click", () => api.ask("Voice settings"));
      });
      landFocus(m.el);
      api.say(aloud ? "Saved. I will read every answer aloud in this voice." : "Saved. I will use this voice when you talk to me. Tap the microphone to try it.", HOME_CHIPS, true);     // shown, not spoken: the sample is still playing
    }
    saveBtn.addEventListener("click", () => play(true));
    tryBtn.addEventListener("click", () => play(false));
    forgetBtn.addEventListener("click", () => {
      voice.natural.forget();
      now = voice.natural.state();
      list = now.voices; picked = ""; idEl.value = ""; asked = ""; showAll = false; working = false;
      busyButtons(false);
      flow.querySelectorAll('[data-row="key"] input').forEach((el) => { el.value = ""; });      // also in an older Voice card
      morph(m.el, () => { drawVoices(); draw(); });
      tell("The key is removed from this browser. I am using the phone's voice.", "good");
      backToVoices();                        // the button that was pressed is gone
    });
    return m.el;
  };

  /* ---- add to calendar (makes a real .ics file) ---- */
  function saveCalendarFile(day, time, title, place, reason) {
    const [, hh, mm, ap] = time.match(/(\d+):(\d+)\s*(AM|PM)/);
    const start = new Date(day);
    start.setHours((+hh % 12) + (ap === "PM" ? 12 : 0), +mm, 0, 0);
    const end = new Date(start.getTime() + 30 * 60000);
    const stamp = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
    const clean = (s) => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, " ");
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Carely prototype//EN", "BEGIN:VEVENT",
      `UID:${Date.now()}@member-assistant.example`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`,
      `SUMMARY:${clean(title)}`, `LOCATION:${clean(place)}`, `DESCRIPTION:${clean("Reason: " + reason)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    try {
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      const a = document.createElement("a");
      a.href = url; a.download = "appointment.ics";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      statusEl.textContent = "Calendar file saved.";
    } catch (err) { statusEl.textContent = "Could not save the calendar file here."; }
  }

  /* =========================================================
     4. THE CONVERSATION
     ========================================================= */

  let busy = false;
  let lastAsk = "";

  let contextChips = [];
  let shownChips = "";
  function drawChips(list) {
    const key = list.join("|");
    if (key === shownChips) return;
    shownChips = key;
    chipsEl.innerHTML = "";
    list.slice(0, 8).forEach((label, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = label;
      b.style.setProperty("--i", i);
      b.addEventListener("click", () => { input.value = ""; syncBar(); ask(label); });
      chipsEl.appendChild(b);
    });
    chipsEl.scrollLeft = 0;
  }
  // chips that fit the moment (after an answer, or on the home screen)
  function setChips(list) {
    contextChips = list || [];
    if (!input.value.trim()) drawChips(contextChips);
  }

  // while the member types, the chips guess what they mean
  const PHRASES = ["Schedule a visit", "Schedule a video visit", "Schedule my yearly checkup", "Find a dermatologist", "Find a therapist",
    "Find a physical therapist", "Find urgent care near me", "Is physical therapy covered?", "Is an MRI covered?", "Is acupuncture covered?",
    "Where is my claim?", "Show my ID card", "My deductible", "Refill my prescription", "Talk to a person", "Talk to a nurse",
    "What will an MRI cost?", "Is my MRI approved?"];
  function predict(text) {
    const words = text.toLowerCase().replace(/[?.,!]/g, "").split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    const scored = [];
    for (const phrase of PHRASES) {
      const parts = phrase.toLowerCase().replace(/[?]/g, "").split(" ");
      let score = 0, ok = true;
      for (const w of words) {
        const at = parts.findIndex((x) => x.startsWith(w));
        if (at < 0) { ok = false; break; }
        score += 10 - at;
      }
      if (ok && phrase.toLowerCase().replace(/[?]/g, "") !== words.join(" ")) scored.push([score, phrase]);
    }
    return scored.sort((a, b) => b[0] - a[0]).slice(0, 3).map((x) => x[1]);
  }
  // chips and the swipe row: a focused item scrolls into view, and a mouse wheel scrolls the chips sideways
  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (t.closest && t.closest(".chips, .strip") && t.matches(":focus-visible")) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
  chipsEl.addEventListener("wheel", (e) => {
    if (e.deltaX || !e.deltaY || chipsEl.scrollWidth <= chipsEl.clientWidth) return;
    chipsEl.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive: false });

  function syncChips() {
    const text = input.value.trim();
    if (!text) return drawChips(contextChips);
    const guesses = predict(text);
    drawChips(guesses.length ? guesses : contextChips);
  }

  const dock = $(".dock");
  let dockH = 150;
  function sizeLastTurn() {
    dockH = dock.offsetHeight;
    app.style.setProperty("--dock-h", dockH + "px");
    flow.style.setProperty("--turn-min", Math.max(0, page.clientHeight - dockH - 64) + "px");
  }
  function showTurn(turn) {
    sizeLastTurn();
    turn.scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "auto" : "smooth" });
  }
  // scroll just enough to show el, but never push `anchor` off the top
  function keepInView(el, anchor = el) {
    const r = el.getBoundingClientRect(), a = anchor.getBoundingClientRect(), p = page.getBoundingClientRect();
    const need = r.bottom - (p.bottom - dockH) + 24, room = a.top - p.top - 44;
    if (need > 0 && room > 0) page.scrollBy({ top: Math.min(need, room), behavior: reduceMotion.matches ? "auto" : "smooth" });
  }

  // the assistant's sentence arrives word by word
  function speak(turn, text, extraClass = "") {
    const p = document.createElement("p");
    p.className = "say " + extraClass;
    const words = text.split(" ");
    words.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w"; s.style.setProperty("--i", i); s.textContent = w;
      p.appendChild(s);
      if (i < words.length - 1) p.appendChild(document.createTextNode(" "));
    });
    turn.appendChild(p);
    setTimeout(() => { if (p.isConnected) p.textContent = text; }, reduceMotion.matches ? 0 : words.length * 34 + 600);
    return wait(pace(Math.min(900, words.length * 34 + 200)));
  }

  // a card is composed first (soft bars), then its parts arrive
  async function mount(turn, ui) {
    const make = MODULES[ui.type];
    if (!make) return null;                                  // unknown card types are ignored, never drawn
    const el = make(ui.props || {}, api(turn));
    const cards = el.classList.contains("mod") ? [el] : [...el.querySelectorAll(".mod")];
    cards.forEach((c) => { stagger(c); if (!reduceMotion.matches) c.classList.add("is-composing"); });
    turn.appendChild(el);
    await wait(pace(420));
    cards.forEach((c) => { c.classList.remove("is-composing"); c.classList.add("is-built"); });
    el.querySelectorAll("[data-fill]").forEach((i) => requestAnimationFrame(() => (i.style.width = i.dataset.fill + "%")));
    return el;
  }

  // the newest unconfirmed card. The chat bar can change it or confirm it.
  let activeDraft = null;
  const liveDrafts = {};
  function setDraft(d) {
    if (d) {
      const old = liveDrafts[d.kind];
      if (old && old !== d && old.open && old.el.isConnected) {
        old.open = false;
        old.el.classList.add("is-muted");
        const pill = old.el.querySelector(".pill"); if (pill) pill.textContent = "Replaced";
        old.el.querySelectorAll("input").forEach((i) => (i.disabled = true));
        const acts = old.el.querySelector(".mod__actions"); if (acts) acts.innerHTML = "";
      }
      liveDrafts[d.kind] = d;
    }
    activeDraft = d;
    if (!live.on()) input.placeholder = d && d.set ? "Any changes?" : "Ask Carely";
  }
  const DAY_RE = [/\bsun(day)?\b/, /\bmon(day)?\b/, /\btue(s|sday)?\b/, /\bwed(nesday)?\b/, /\bthu(r|rs|rsday)?\b/, /\bfri(day)?\b/, /\bsat(urday)?\b/];
  // only a whole short message counts as yes or no. "ok but make it thursday" is an edit.
  const whole = (words, extra = "please|thanks|thank you|it|that") => new RegExp("^(please )?(" + words + ")(( and)?[ ,.!]+(" + words + "|" + extra + "))*[ .!]*$");
  const YES = whole("yes|yep|yeah|sure|ok|okay|confirm|confirm it|book it|book that|schedule it|order it|looks good|do it|go ahead|that works|sounds good|perfect");
  const NO = whole("no|nope|cancel|cancel it|never ?mind|not now|stop|forget it|do not book it|don.?t book it|do not order it|don.?t order it");
  // Spoken words can be misheard, so by voice a draft is never committed on one word:
  // "confirm" makes it read the details back and ask "Is that right?", and only a clear yes after that commits.
  // No loose "it" or "that" after a spoken yes: "correct that" means fix it, and "yes, that..." is a sentence cut short.
  const VOICE_YES = whole("yes|yes it is|yep|yeah|correct|right|that is right|that.?s right|it is", "please|thanks|thank you|confirm|confirm it|book it|order it|go ahead");
  const VOICE_NO = whole("no|nope|not right|wrong|that is wrong|that.?s wrong|cancel|stop|wait");
  function readEdit(text, viaVoice) {
    const d = activeDraft;
    if (!d || !d.open || !d.el.isConnected) return null;
    let t = text.toLowerCase().trim();
    const decide = () => {
      if (viaVoice && d.asked && d.asked === d.readback()) {      // the card may have been changed by tap since the read back
        if (VOICE_YES.test(t)) return { act: "confirm" };
        if (VOICE_NO.test(t)) return { act: "keep" };
        if (YES.test(t)) return { act: "readback", again: true };      // "confirm", "ok" or "book it" again: ask once more
        return null;
      }
      if (YES.test(t)) return { act: viaVoice ? "readback" : "confirm" };
      if (NO.test(t)) return { act: "skip" };
      return null;
    };
    let hit = decide();
    if (hit) return hit;
    t = t.replace(/^(yes|yep|yeah|sure|ok|okay)\b[\s,.!]*(but\s+)?/, "");      // drop a leading "ok," and read the rest
    hit = decide();
    if (hit) return hit;
    d.asked = false;                             // anything else is a change or a new request, so the question is off
    const lost = () => (understand(text).unknown ? { act: "help" } : null);      // keep the draft when the message means nothing else
    if (d.kind === "refill") {
      const patch = {};
      if (/\b90\b|three months|3 months/.test(t)) patch.supply = 90;
      else if (/\b30\b|one month|1 month/.test(t)) patch.supply = 30;
      if (/mail|deliver|ship/.test(t)) patch.how = "mail";
      else if (/pick ?up|pharmacy|in person/.test(t)) patch.how = "pickup";
      return Object.keys(patch).length ? { act: "set", patch } : lost();
    }
    if (d.kind !== "visit") return lost();
    if (/^(and |so |but )?(how much|what (does|will|would|do) (it|this|that|i) (cost|pay|owe))/.test(t) && !/mri|scan|claim|deductible|therap|cover/.test(t)) return { act: "tell", line: d.costLine() };
    if (/schedul|book|find|cover|claim|id card|deductible|refill|talk to|show my|how much|what is/.test(t)) return null;
    const s = d.state(), patch = {};
    if (/\b(no|not|without)( a)? video|in.?person|office|face to face/.test(t)) patch.video = false;
    else if (/video|virtual|online|telehealth/.test(t)) patch.video = true;
    // the day the member wants: skip days they ruled out ("thursday instead of friday"), and take the last one named
    const said = t.replace(/\b(not|instead of|rather than|from)\s+(on\s+)?\w+/g, " ");
    let at = -1;
    DAY_RE.forEach((re, i) => { const hit = said.match(re), k = s.days.findIndex((x) => x.getDay() === i); if (hit && k >= 0 && hit.index > at) { at = hit.index; patch.day = k; } });
    let rest = t;
    if (/\b(next day|day later|day after|push it)\b/.test(t)) { patch.day = s.day + 1; rest = rest.replace(/day later/, ""); }
    else if (/\bday (before|earlier)\b|sooner|soonest/.test(t)) { patch.day = s.day - 1; rest = rest.replace(/day earlier/, ""); }
    else if (/tomorrow/.test(t)) patch.day = 0;
    else if (/next week/.test(t)) { const k = s.days.findIndex((x, i) => i > 0 && x.getDay() === 1); if (k >= 0) patch.day = k; }
    const onDay = SLOTS[clamp(patch.day != null ? patch.day : s.day, 0, 4)];
    const clock = onDay.findIndex((x) => new RegExp("(^|[^\\d])" + x.replace(/ (AM|PM)$/, "") + "\\b").test(rest));   // "make it 10:30"
    if (clock >= 0) patch.slot = clock;
    else if (/\bmorning\b|\bearly\b/.test(rest)) patch.slot = 0;
    else if (/afternoon|evening|after work|end of day/.test(rest)) patch.slot = 2;
    else if (/\bnoon\b|midday|lunch/.test(rest)) patch.slot = 1;
    else if (/\bearlier\b/.test(rest)) patch.slot = s.slot - 1;
    else if (/later/.test(rest)) patch.slot = s.slot + 1;
    const why = REASONS.find(([re]) => re.test(t));
    if (why) patch.reason = why[1];
    return Object.keys(patch).length ? { act: "set", patch } : lost();
  }

  // a short exchange about the card that is already on screen (no new card)
  async function editInPlace(text, edit, viaVoice) {
    const d = activeDraft, turn = d.el.closest(".turn") || flow.lastElementChild;
    busy = true;
    try {
    const q = document.createElement("div");
    q.className = viaVoice ? "ask ask--voice" : "ask"; q.style.marginTop = "18px"; q.textContent = text;
    turn.appendChild(q);
    face.sent(q);
    const glide = reduceMotion.matches ? "auto" : "smooth";
    if (edit.act === "readback" || edit.act === "keep") {
      // by voice: read the details back and wait for a clear yes, or step back from that question
      d.asked = edit.act === "readback" ? d.readback() : false;      // remember exactly what was read back
      const line = d.asked ? (edit.again ? "Please answer yes or no. " : "") + d.readback() : "Okay. Nothing is done yet. Tell me what to change.";
      d.el.scrollIntoView({ block: "nearest", behavior: glide });
      voice.say(line);
      await speak(turn, line, "say--after");
      turn.lastElementChild.scrollIntoView({ block: "end", behavior: glide });
      statusEl.textContent = line;
    } else if (edit.act === "help" || edit.act === "tell") {
      const said = edit.act === "tell" ? edit.line : d.help;
      const line = viaVoice ? said : said.replace("Say confirm", "Confirm").replace("say confirm", "confirm");      // typed: it does not ask the member to say anything
      voice.say(line);
      await speak(turn, line, "say--after");
      turn.lastElementChild.scrollIntoView({ block: "end", behavior: glide });
      statusEl.textContent = line;
    } else if (edit.act === "set") {
      const changed = d.set(edit.patch);
      const line = changed.length ? `Done. It is now ${d.describe()}. Confirm when you are ready.` : "It is already set that way. Confirm when you are ready.";
      const row = d.el.querySelector(".row.flash") || d.el;
      row.scrollIntoView({ block: "center", behavior: glide });
      await wait(pace(350));
      voice.say(line);
      await speak(turn, line, "say--after");
      turn.lastElementChild.scrollIntoView({ block: "end", behavior: glide });     // the reply stops just above the chat bar
      statusEl.textContent = line;
      face.lookAtEl(row);
    } else if (edit.act === "confirm") d.confirm();
    else d.skip();
    } finally { busy = false; voice.afterTurn(); }
    return true;
  }

  // what a card is allowed to do
  function api(turn) {
    return {
      draft: (d) => setDraft(d),
      ask: (text) => ask(text),
      say: (text, next, silent) => {
        if (live.on() && live.cardSaid(text)) { if (next) setChips(next); statusEl.textContent = text; return; }      // Carely says it herself
        if (!silent) voice.say(text);
        speak(turn, text, "say--after");
        const line = turn.lastElementChild;
        requestAnimationFrame(() => keepInView(line, line));
        if (next) setChips(next);
        statusEl.textContent = text;
      },
      celebrate: (el) => face.happy(el),
      lastTopic: () => lastAsk,
    };
  }

  async function ask(raw, how) {
    const text = String(raw || "").trim();
    if (!text || busy) return false;
    if (live.on() && live.send(text)) return true;     // a conversation is on: Carely answers on the line
    const viaVoice = how === "voice";
    if (viaVoice) voice.hush(); else voice.cancel();                       // a new request stops anything being read aloud. A tapped or typed one also closes the microphone
    if (window.matchMedia("(pointer: coarse)").matches) input.blur();     // on phones, put the keyboard away so the card has room
    const edit = isUrgent(text) ? null : readEdit(text, viaVoice);   // safety always wins over an open draft
    if (edit) return editInPlace(text, edit, viaVoice);
    busy = true;
    setThinking(true);                                // visual only: the gradient ring comes alive while the answer is made
    try {
    app.classList.add("has-flow");
    place(true);
    setDraft(null);                                   // a new request: older drafts can still be tapped, but typing no longer changes them
    flow.querySelectorAll(".mod").forEach((m) => m.classList.add("is-past"));

    const turn = document.createElement("article");
    turn.className = "turn";
    const q = document.createElement("div");
    q.className = viaVoice ? "ask ask--voice" : "ask";
    q.textContent = text;
    turn.appendChild(q);
    flow.appendChild(turn);
    showTurn(turn);
    face.sent(q);

    let spec;
    try { spec = understand(text); }
    catch (err) { spec = { say: "Something went wrong on my side. Please try again.", ui: [], next: HOME_CHIPS }; }
    if (!/talk to|person|wrong/.test(text.toLowerCase())) lastAsk = text;

    // in voice mode the sentence is also read aloud. A draft adds what the member can say next.
    const isDraft = (spec.ui || []).some((u) => u.type === "schedule" || u.type === "refill" || u.type === "handoff");
    const aloud = spec.say + (isDraft ? voice.hint() : "");
    const urgent = isUrgent(text);                    // an emergency is said at once by the phone's own voice. It never waits on the network
    const early = urgent || voice.early();
    if (early) voice.say(aloud, urgent);              // the natural voice takes a moment to arrive, so it is asked for at once
    await wait(pace(260));
    face.think(true);
    await wait(pace(rand(320, 520)));
    if (!early) voice.say(aloud);
    await Promise.race([speak(turn, spec.say), wait(pace(380))]);     // the card starts while the sentence is still arriving
    let last = null;
    for (const ui of spec.ui || []) last = (await mount(turn, ui)) || last;
    face.think(false);
    if (last) face.lookAtEl(last);
    setChips(spec.next && spec.next.length ? spec.next : HOME_CHIPS);
    statusEl.textContent = spec.say + (last ? " A card was added below." : "");
    // if a chip or button was used with the keyboard, do not leave focus on nothing
    if (document.activeElement === document.body) {
      const line = turn.querySelector(".say");
      if (line) { line.tabIndex = -1; line.focus({ preventScroll: true }); }
    }
    } finally { busy = false; face.think(false); setThinking(false); voice.afterTurn(); }
    return true;
  }

  function goHome() {
    if (busy) return;
    live.stop();
    voice.cancel();
    flow.innerHTML = "";
    setDraft(null);
    app.classList.remove("has-flow");
    place(true);
    page.scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
    setChips(HOME_CHIPS);
    lastAsk = "";
    statusEl.textContent = "Back at the start.";
  }

  /* =========================================================
     5. THE AVATAR  (eyes that blink, look around and react)
     ========================================================= */

  const face = (() => {
    const REST = { x: -0.78, y: 0 };
    const eyes = { x: REST.x, y: REST.y, vx: 0, vy: 0, tx: REST.x, ty: REST.y, lid: 0, lidTarget: 0, open: 1, openTarget: 1, hop: 0, hopV: 0, glow: 0.85, glowTarget: 0.85 };
    let mode = "idle";            // idle | follow | typing | thinking
    let running = false, lastT = 0, H = 68;

    function readSize() { H = parseFloat(getComputedStyle(bar).height) || 68; }

    function render() {
      const gx = eyes.x, gy = eyes.y, K = 0.2;
      const w0 = 0.32 * H, gap = 0.085 * H;
      const wl = w0 * (1 + K * gx), wr = w0 * (1 - K * gx), total = 2 * w0 + gap;
      const shiftX = (gx < 0 ? 0.13 : 0.085) * H * gx;
      const shiftY = 0.085 * H * gy + eyes.hop * H;
      const lx = -total / 2 + wl / 2 + shiftX, rx = total / 2 - wr / 2 + shiftX;
      const lidScale = Math.max(0.06, (1 - eyes.lid) * eyes.open * (1 - 0.05 * Math.abs(gy)));
      const tilt = 4 * gx;
      eyeL.style.transform = `translate(${lx.toFixed(2)}px, ${shiftY.toFixed(2)}px) rotate(${(-tilt * 0.9).toFixed(2)}deg) scale(${(wl / w0).toFixed(3)}, ${lidScale.toFixed(3)})`;
      eyeR.style.transform = `translate(${rx.toFixed(2)}px, ${shiftY.toFixed(2)}px) rotate(${(-tilt * 1.6).toFixed(2)}deg) scale(${(wr / w0).toFixed(3)}, ${lidScale.toFixed(3)})`;
      avatarEl.style.setProperty("--glow", eyes.glow.toFixed(3));
      avatarEl.style.setProperty("--pulse", (1 + (eyes.glow - 0.85) * 0.12).toFixed(4));
    }

    function step(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
      lastT = t;
      const stiff = mode === "follow" ? 170 : 120, damp = mode === "follow" ? 22 : 17;
      eyes.vx += ((eyes.tx - eyes.x) * stiff - eyes.vx * damp) * dt;
      eyes.vy += ((eyes.ty - eyes.y) * stiff - eyes.vy * damp) * dt;
      eyes.x += eyes.vx * dt; eyes.y += eyes.vy * dt;
      const lidSpeed = eyes.lidTarget > eyes.lid ? 18 : 11;
      eyes.lid += (eyes.lidTarget - eyes.lid) * Math.min(1, lidSpeed * dt * 1.6);
      eyes.open += (eyes.openTarget - eyes.open) * Math.min(1, 9 * dt);
      eyes.glow += (eyes.glowTarget - eyes.glow) * Math.min(1, 5 * dt);
      eyes.hopV += (-eyes.hop * 260 - eyes.hopV * 14) * dt;
      eyes.hop += eyes.hopV * dt;
      if (mode === "thinking") {
        const s = t / 1000;
        eyes.tx = -0.35 + Math.sin(s * 2.4) * 0.42;
        eyes.ty = -0.72 + Math.sin(s * 4.8) * 0.06;
        eyes.glowTarget = 0.95 + Math.sin(s * 5) * 0.12;
      }
      if (mode === "listening") {                 // looks straight at you, eyes a little wider, breathing softly
        const s = t / 1000;
        eyes.tx = Math.sin(s * 1.1) * 0.05;
        eyes.ty = -0.04;
        eyes.openTarget = 1.1;
        eyes.glowTarget = 1 + Math.sin(s * 3.2) * 0.07;
      }
      if (mode === "talking") {                   // a small quick flutter, like speech
        const s = t / 1000;
        eyes.tx = -0.15 + Math.sin(s * 0.9) * 0.08;
        eyes.ty = -0.08;
        eyes.openTarget = 1 + Math.sin(s * 10) * 0.06 + Math.sin(s * 6.3) * 0.03;
        eyes.glowTarget = 1 + Math.sin(s * 8) * 0.1;
      }
      render();
      const settled = mode !== "thinking" && mode !== "listening" && mode !== "talking" &&
        Math.abs(eyes.tx - eyes.x) < 0.002 && Math.abs(eyes.ty - eyes.y) < 0.002 &&
        Math.abs(eyes.vx) < 0.01 && Math.abs(eyes.vy) < 0.01 &&
        Math.abs(eyes.lidTarget - eyes.lid) < 0.005 && Math.abs(eyes.openTarget - eyes.open) < 0.005 &&
        Math.abs(eyes.glowTarget - eyes.glow) < 0.005 && Math.abs(eyes.hop) < 0.0005 && Math.abs(eyes.hopV) < 0.005;
      if (settled) { running = false; return; }
      requestAnimationFrame(step);
    }
    function wake() { if (running) return; running = true; lastT = performance.now(); requestAnimationFrame(step); }

    function lookAt(x, y) { eyes.tx = clamp(x, -1, 1); eyes.ty = clamp(y, -1, 1); wake(); }
    function lookAtPoint(px, py) {
      const r = bar.getBoundingClientRect();
      const dx = px - (r.right - H * 0.55), dy = py - (r.top + r.height / 2);
      const nx = dx / (Math.abs(dx) + Math.max(140, window.innerWidth * 0.22));
      const ny = dy / (Math.abs(dy) + Math.max(110, window.innerHeight * 0.2));
      lookAt(nx * 1.25, ny * 1.25);
    }
    function lookAtEl(el) {
      if (reduceMotion.matches || !el) return;
      const r = el.getBoundingClientRect();
      lookAtPoint(r.left + Math.min(r.width, 300) / 2, r.top + Math.min(r.height, 300) / 2);
      blink(1, 70);
    }

    let blinkTimer = 0;
    function blink(times = 1, hold = 70) {
      if (eyes.lidTarget === 1) return;
      let n = times;
      const once = () => {
        eyes.lidTarget = 1; wake();
        setTimeout(() => { eyes.lidTarget = 0; wake(); if (--n > 0) setTimeout(once, 150); }, hold);
      };
      once();
    }
    function scheduleBlink() {
      clearTimeout(blinkTimer);
      blinkTimer = setTimeout(() => {
        if (!document.hidden) { if (reduceMotion.matches) blink(1, 140); else blink(Math.random() < 0.16 ? 2 : 1, rand(60, 90)); }
        scheduleBlink();
      }, reduceMotion.matches ? rand(5000, 8000) : rand(2200, 5600));
    }

    let wanderTimer = 0;
    function wander() {
      clearTimeout(wanderTimer);
      if (reduceMotion.matches) return;
      wanderTimer = setTimeout(() => {
        if (mode === "idle" && !document.hidden) {
          const roll = Math.random();
          let x, y;
          if (roll < 0.3) { x = REST.x + rand(-0.12, 0.12); y = rand(-0.1, 0.1); }
          else if (roll < 0.52) { x = rand(-0.12, 0.12); y = rand(-0.08, 0.08); }
          else if (roll < 0.78) { x = rand(-0.9, -0.2); y = rand(-0.85, -0.35); }
          else if (roll < 0.9) { x = rand(0.35, 0.8); y = rand(-0.4, 0.25); }
          else { x = rand(-1, -0.5); y = rand(0.2, 0.6); }
          if (REST.x === 0 && roll >= 0.52) x *= Math.random() < 0.5 ? 0.6 : -0.6;      // round Carely: glances go to either side, and not as far
          const far = Math.hypot(x - eyes.x, y - eyes.y) > 0.9;
          lookAt(x, y);
          if (far && Math.random() < 0.45) blink(1, 60);
          if (Math.random() < 0.22) setTimeout(() => { if (mode === "idle") lookAt(x + rand(-0.25, 0.25), y + rand(-0.2, 0.2)); }, rand(260, 520));
        }
        wander();
      }, rand(1100, 3400));
    }

    let voiceState = "";
    const thinkers = new Set();
    function setMode(next) {
      mode = next;
      if (next === "idle") { eyes.glowTarget = 0.85; eyes.openTarget = document.activeElement === input ? 1.05 : 1; }
      wake();
    }

    let followTimer = 0;
    function follow(px, py) {
      // visual only: the highlight on the glass slides toward the pointer or finger
      const br = bar.getBoundingClientRect();
      bar.style.setProperty("--mx", clamp(((px - br.left) / br.width) * 100, 6, 74).toFixed(1) + "%");
      if (reduceMotion.matches || mode === "thinking" || mode === "listening" || mode === "talking") return;
      mode = "follow";
      lookAtPoint(px, py);
      clearTimeout(followTimer);
      followTimer = setTimeout(() => {
        if (mode !== "follow") return;
        if (document.activeElement === input && input.value) { setMode("typing"); watchCaret(); } else setMode("idle");
      }, 1500);
    }

    const measure = document.createElement("canvas").getContext("2d");
    function watchCaret() {
      if (reduceMotion.matches) return;
      const cs = getComputedStyle(input), r = input.getBoundingClientRect();
      measure.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const pos = input.selectionStart == null ? input.value.length : input.selectionStart;
      const w = measure.measureText(input.value.slice(0, pos)).width;
      lookAtPoint(r.left + clamp(w - input.scrollLeft, 0, r.width) + 6, r.top + r.height * 0.62);
    }

    window.addEventListener("pointermove", (e) => { if (e.pointerType !== "touch") follow(e.clientX, e.clientY); }, { passive: true });
    window.addEventListener("pointerdown", (e) => follow(e.clientX, e.clientY), { passive: true });
    window.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) follow(t.clientX, t.clientY); }, { passive: true });
    document.documentElement.addEventListener("pointerleave", () => { if (mode === "follow") setMode("idle"); });

    const live = () => mode === "thinking" || mode === "listening" || mode === "talking";
    input.addEventListener("focus", () => { eyes.openTarget = 1.05; if (!live()) { setMode(input.value ? "typing" : "idle"); watchCaret(); } });
    input.addEventListener("blur", () => { eyes.openTarget = 1; if (mode === "typing") setMode("idle"); wake(); });
    input.addEventListener("input", () => {
      if (live()) return;
      setMode("typing"); watchCaret();
      if (!reduceMotion.matches) eyes.hopV -= 0.22;
      wake();
    });
    ["keyup", "click", "select"].forEach((ev) => input.addEventListener(ev, () => { if (mode === "typing") watchCaret(); }));

    const onMotionPref = () => {
      if (reduceMotion.matches) { clearTimeout(wanderTimer); mode = "idle"; lookAt(REST.x, REST.y); } else wander();
      scheduleBlink();
    };
    if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", onMotionPref);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { scheduleBlink(); wander(); wake(); } });

    return {
      start() { readSize(); render(); scheduleBlink(); wander(); setTimeout(() => blink(reduceMotion.matches ? 1 : 2, 70), 700); },
      resize() { readSize(); render(); },
      // round Carely rests looking straight at the member. In the chat bar she rests looking along it, toward the words
      center(on) { REST.x = on ? 0 : -0.78; if (mode === "idle" || mode === "follow") lookAt(REST.x, REST.y); },
      blink,
      lookAtEl,
      // `who` lets two things think at once: an answer being made, and the natural voice on its way
      think(on, who = "answer") {
        if (on) thinkers.add(who); else thinkers.delete(who);
        if (reduceMotion.matches) return;
        if (thinkers.size) setMode("thinking");
        else { setMode(voiceState === "talking" || voiceState === "listening" ? voiceState : "idle"); wander(); }
      },
      // voice: "listening", "talking" or "" (back to normal)
      voice(state) {
        voiceState = state;
        if (reduceMotion.matches || mode === "thinking") return;
        if (state) setMode(state); else { eyes.openTarget = 1; setMode("idle"); wander(); }
      },
      heard() { if (!reduceMotion.matches) { eyes.hopV -= 0.5; wake(); } },      // a small nod each time new words arrive
      sent(el) {
        if (reduceMotion.matches) return;
        eyes.hopV -= 1.5; eyes.openTarget = 0.5; eyes.glowTarget = 1.15; wake();
        setTimeout(() => { eyes.openTarget = 1.08; wake(); }, 240);
        const r = el.getBoundingClientRect();
        setTimeout(() => { if (mode !== "thinking") lookAtPoint(r.left + r.width / 2, r.top + r.height / 2); }, 120);
      },
      happy(el) {
        if (reduceMotion.matches) return;
        eyes.hopV -= 2.1; eyes.openTarget = 0.42; eyes.glowTarget = 1.25; wake();
        setTimeout(() => { eyes.openTarget = 1.1; wake(); }, 320);
        setTimeout(() => { eyes.openTarget = 1; eyes.glowTarget = 0.85; wake(); }, 1100);
        if (el) { const r = el.getBoundingClientRect(); lookAtPoint(r.left + r.width / 2, r.top + 60); }
      },
      hello() {
        if (reduceMotion.matches) { blink(1, 140); return; }
        eyes.hopV -= 1.1; eyes.openTarget = 1.12; wake();
        setTimeout(() => { eyes.openTarget = 1.05; wake(); }, 260);
        blink(2, 60);
      },
    };
  })();

  /* =========================================================
     6. CHAT BAR WIRING AND LAYOUT
     ========================================================= */

  function syncBar() {
    const hasText = input.value.trim().length > 0;
    bar.classList.toggle("has-text", hasText);
    const hearing = bar.classList.contains("is-listening"), talking = bar.classList.contains("is-speaking");
    sendBtn.tabIndex = hasText && !hearing ? 0 : -1;             // send is hidden while it listens
    $("#mic").tabIndex = hasText && !hearing ? -1 : 0;
    avatarBtn.setAttribute("aria-label", hearing ? "Cancel listening" : talking ? "Stop speaking" : hasText ? "Send" : "Start typing");
    syncOrb();
  }
  async function submit() {
    if (voice.sendHeard()) return;               // heard words are always sent as voice, never as typed text
    const text = input.value.trim();
    if (!text || busy) return;
    if (live.on()) { input.value = ""; syncBar(); syncChips(); if (!live.send(text)) ask(text); return; }      // typed during a conversation
    voice.typed();                               // typing means answers are shown, not read aloud
    input.value = "";
    syncBar();
    syncChips();
    ask(text);
  }
  input.addEventListener("input", () => { syncBar(); syncChips(); });
  bar.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  avatarBtn.addEventListener("click", () => {
    if (app.classList.contains("voice")) { $("#mic").click(); return; }      // voice first: Carely is the button. It does what the microphone button does
    if (voice.busy()) { voice.cancel(); return; }             // tapping the face stops listening or speaking
    if (input.value.trim()) submit(); else { input.focus(); face.hello(); }
  });
  homeBtn.addEventListener("click", () => { goHome(); face.blink(1, 60); });

  // Page Up, Page Down and the arrow keys scroll the conversation, even while the text box has focus
  document.addEventListener("keydown", (e) => {
    if (e.key === "Tab") root.classList.add("keys");
    if (e.key === "Escape" && live.on()) { live.stop(); return; }             // Escape ends a live conversation
    if (e.key === "Escape" && voice.busy()) { voice.cancel(); return; }       // Escape stops listening or speaking
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.target !== input && e.target !== document.body) return;
    const arrows = e.target !== input || !input.value;
    const dy = { PageDown: 0.8, PageUp: -0.8, ArrowDown: arrows ? 0.15 : 0, ArrowUp: arrows ? -0.15 : 0 }[e.key];
    if (!dy) return;
    e.preventDefault();
    page.scrollBy({ top: dy * page.clientHeight, behavior: e.repeat || reduceMotion.matches ? "auto" : "smooth" });
  });
  window.addEventListener("pointerdown", () => root.classList.remove("keys"));

  // keep the bar above the on-screen keyboard (needed on iOS)
  const vv = window.visualViewport;
  function syncViewport() {
    let kb = 0;
    if (vv && vv.scale < 1.01) kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);   // ignore pinch zoom
    if (kb < 60) kb = 0;
    root.style.setProperty("--kb", kb + "px");
    root.classList.toggle("kb-open", kb > 0);
    if (kb > 0) window.scrollTo(0, 0);
    sizeLastTurn();
    // keep the field being edited inside a card above the keyboard
    const a = document.activeElement;
    if (kb > 0 && a && a !== page && page.contains(a)) a.scrollIntoView({ block: "center" });
  }
  if (vv) { vv.addEventListener("resize", syncViewport); vv.addEventListener("scroll", syncViewport); }
  function onResize() { face.resize(); syncBar(); syncViewport(); }
  if (window.ResizeObserver) new ResizeObserver(sizeLastTurn).observe(dock);
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  /* ---- glass (visual only, no behavior) ---- */
  // the gradient ring's color wheel is squashed to the bar's own proportions, so the greens travel evenly
  function syncGlass() { bar.style.setProperty("--ring-k", (bar.offsetHeight / Math.max(1, bar.offsetWidth)).toFixed(4)); }
  window.addEventListener("resize", syncGlass);
  // the ring keeps flowing while it fades out, and flows faster while the assistant thinks
  const ringWheel = $(".bar__ring i");
  let ringRest = 0;
  function ringWake() { clearTimeout(ringRest); bar.classList.add("is-lit"); }
  function ringSleep() {
    clearTimeout(ringRest);
    ringRest = setTimeout(() => {
      const awake = bar.matches(":focus-within") || ["is-thinking", "is-listening", "is-speaking", "is-live", "is-calling"].some((c) => bar.classList.contains(c));
      if (!awake) bar.classList.remove("is-lit");
    }, 800);
  }
  function ringPace(rate) {
    const flow = ringWheel && ringWheel.getAnimations ? ringWheel.getAnimations()[0] : null;
    if (flow && flow.updatePlaybackRate) flow.updatePlaybackRate(rate);
  }
  function setThinking(on) {
    bar.classList.toggle("is-thinking", on);
    if (on) { ringWake(); ringPace(3.2); } else { ringPace(1); ringSleep(); }
  }
  bar.addEventListener("focusin", ringWake);
  bar.addEventListener("focusout", ringSleep);


  /* =========================================================
     7. VOICE
     Talk instead of typing, and hear the answer.
     Listening uses the browser's speech service (SpeechRecognition).
     Speaking uses the built-in voices (speechSynthesis).
     Nothing here needs a server of ours. A real health product should not
     send member speech through a browser's consumer speech service. It would
     use on-device recognition or a speech provider under a privacy agreement.

     Rules this follows:
       - voice never does more than typing, and is stricter: by voice a draft is read back
         and needs a clear yes before it is committed. Paying is by tap only
       - safety words win, exactly as they do for typed text, and are checked while listening
