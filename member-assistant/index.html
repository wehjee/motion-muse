      if (!url) {
        const stop = new AbortController();
        let slow = false;
        job.stop = stop;
        const limit = setTimeout(() => { slow = true; stop.abort(); }, NATURAL.styles[style].wait);      // an answer must never hang on the network
        let got;
        try { got = await fetchClip(toSpeech(text).slice(0, 900), key, voiceId, style, stop.signal); }
        catch (err) { got = { why: slow ? "slow" : "offline" }; }
        clearTimeout(limit);
        job.stop = null;
        if (current !== job) return "";      // it was told to stop while the sound was on its way
        if (got.why) return got.why;
        url = URL.createObjectURL(new Blob([got.blob], { type: "audio/mpeg" }));
        clips.set(id, url);
        if (clips.size > 24) { const first = clips.keys().next().value; URL.revokeObjectURL(clips.get(first)); clips.delete(first); }
      }
      const started = await new Promise((resolve) => {
        player.onended = job.done;
        player.onerror = () => resolve(false);
        try {
          player.src = url;
          const p = player.play();           // right away: waiting for the sound to load first can lose the tap's permission
          if (p && p.then) p.then(() => resolve(true), () => resolve(false)); else resolve(true);
        } catch (err) { resolve(false); }
        setTimeout(() => resolve(false), 4000);
      });
      if (current !== job) return "";
      if (!started) {
        player.onended = player.onerror = player.onpause = player.ondurationchange = null;
        rest();                              // the player must not keep holding the answer
        gentle = false;                      // from now on a tap makes the player ready the surer way
        return "blocked";
      }
      if (!listening) face.voice("talking");
      job.clip = true;
      player.onerror = job.done;
      // paused from outside the page (a call, the lock screen): the sentence is over, and the microphone does not open by itself after it
      player.onpause = () => {
        const atEnd = player.ended || (isFinite(player.duration) && player.duration > 0 && player.currentTime >= player.duration - 0.3);
        if (!atEnd) job.after = null;
        job.done();
      };
      // in case the end is never reported. The length is a guess until the browser knows the real one
      const watch = () => {
        const secs = isFinite(player.duration) && player.duration > 0 ? player.duration - player.currentTime : 3 + text.length * 0.09;
        clearTimeout(speakTimer);
        speakTimer = setTimeout(job.done, secs * 1000 + 2500);
      };
      watch();
      player.ondurationchange = () => { if (current === job) watch(); };
      return "";
    }

    // one request per sentence. A model that ElevenLabs refuses is skipped for the rest of the visit
    async function fetchClip(text, key, voiceId, style, signal) {
      const all = NATURAL.styles[style].models, open = all.filter((x) => !turnedDown.has(x));
      let why = "error";
      for (const model of open.length ? open : all) {
        const res = await fetch(NATURAL.api + "v1/text-to-speech/" + encodeURIComponent(voiceId) + "?output_format=" + NATURAL.format, {
          method: "POST",
          signal,
          headers: { "xi-api-key": key, "Content-Type": "application/json", Accept: "audio/mpeg" },
          body: JSON.stringify({ text, model_id: model, voice_settings: NATURAL.settings }),
          referrerPolicy: "no-referrer",
          credentials: "omit",
          cache: "no-store",
          redirect: "error",                 // the key must never follow a redirect to another address
        });
        if (res.ok) {
          const blob = await res.blob();
          return blob.size ? { blob } : { why: "error" };
        }
        const no = await whyNot(res);
        why = no.why;
        if (!no.model) break;                // only a refused model is worth another try
        turnedDown.add(model);
      }
      return { why };
    }

    // read ElevenLabs' answer when it says no, and turn it into one of a few plain reasons
    async function whyNot(res) {
      let code = "";
      try {
        const body = await res.json(), d = body && body.detail;
        code = typeof d === "string" ? d : Array.isArray(d) ? d.map((x) => (x && (x.msg || x.type)) || "").join(" ") : d ? [d.code, d.status, d.type, d.message].filter(Boolean).join(" ") : "";
      } catch (err) { /* no details */ }
      code = code.slice(0, 600);             // a very long answer must not hold up the page
      const s = res.status, vague = s === 400 || s === 422;
      let why = "error";
      if (/quota|credit/i.test(code)) why = "credits";
      else if (s === 429 || /concurrent|too_many|rate_limit/i.test(code)) why = "busy";
      else if (/unusual.activity/i.test(code)) why = "paused";
      else if (/voice_not_found|voice.*(not found|does not exist)/i.test(code) || (s === 404 && !/model/i.test(code)) || (vague && /voice/i.test(code) && !/model/i.test(code))) why = "voice";
      else if (/paid_plan|payment_required|free_users|subscription|upgrade|library voice/i.test(code) || s === 402) why = "plan";
      else if (/missing_permission|permission/i.test(code)) why = "scope";
      else if (s === 401 || /invalid_api_key|missing_api_key/i.test(code)) why = "key";
      else if (s === 403) why = "scope";
      else if (s === 408 || s === 409 || s === 425 || s === 429 || s >= 500 || /busy|too_many|rate_limit|concurrent/i.test(code)) why = "busy";
      // a refused model is worth one more try with the next model. So is a plain "bad request" that does not say why
      return { why, model: (/model/i.test(code) && why !== "key" && why !== "credits" && why !== "paused") || (vague && why === "error") };
    }

    // the natural voice failed during a real answer: say why once, and stop trying when it cannot get better by itself
    function trouble(why) {
      natMisses++;
      const lasting = why === "key" || why === "scope" || why === "credits" || why === "voice" || why === "plan" || why === "paused";
      if (lasting || natMisses >= 3) { natOff = true; natWhy = why; }
      const note = WHY[why] + " I am using the phone's voice" + (natOff ? '. Ask for "voice settings" to fix it.' : " for this answer.");
      if (!toastEl.hidden && toastEl.textContent === SAY.first) queued = note;      // the privacy note is read first, for its full time
      else toast(note, 8000);
    }

    function hush() {
      quiet();
      current = null;
      wantListen = false;
      if (canSpeak) { try { if (synth.speaking || synth.pending) synth.cancel(); } catch (err) { /* nothing to stop */ } }
      if (speaking) { spokeEnd = performance.now(); setSpeaking(false); }
    }

    // a voice the account copied from the ElevenLabs voice library. Those need a paid plan when used with a key
    const shared = (v) => !!(v.sharing && typeof v.sharing === "object" && v.is_owner !== true);
    // a voice from the account's list, in the few words the Voice card shows
    function plain(v) {
      const parts = String(v.name).trim().split(/\s+[-–|:]\s+/), L = v.labels && typeof v.labels === "object" ? v.labels : {};
      const str = (x) => (typeof x === "string" ? x : "");
      const feel = parts.slice(1).join(", ") || str(L.descriptive) || str(L.description);
      const said = str(L.accent).replace(/[-_]/g, " "), accent = said.charAt(0).toUpperCase() + said.slice(1);
      const words = [feel, accent && feel.toLowerCase().indexOf(accent.toLowerCase()) < 0 ? accent + " accent" : ""].filter(Boolean).join(". ");
      const line = words.replace(/[.\s]+$/, "").slice(0, 90);
      return { id: String(v.voice_id), name: parts[0].slice(0, 22), feel: line ? line.charAt(0).toUpperCase() + line.slice(1) + "." : "", lib: shared(v) };
    }

    // The Voice card: what is set now, the account's voices, a sample to listen to, and saving or removing the setting.
    const natural = {
      state: () => ({ hasKey: !!natKey, voice: natKey ? natVoice : "", style: natStyle, voices: NATURAL.voices,
        always: always(), hears: canHear(), off: natOff ? WHY[natWhy] || WHY.error : "" }),
      // the voices in the ElevenLabs account that the key belongs to, or null when they cannot be read
      async list(key) {
        for (const path of ["v2/voices?page_size=100", "v1/voices"]) {
          try {
            const stop = new AbortController(), limit = setTimeout(() => stop.abort(), 8000);
            const res = await fetch(NATURAL.api + path, { headers: { "xi-api-key": key || natKey }, signal: stop.signal, referrerPolicy: "no-referrer", credentials: "omit", cache: "no-store", redirect: "error" });
            const body = res.ok ? await res.json() : null;
            clearTimeout(limit);
            const all = body && Array.isArray(body.voices) ? body.voices.filter((v) => v && typeof v.voice_id === "string" && /^[A-Za-z0-9]{8,40}$/.test(v.voice_id) && typeof v.name === "string" && v.name.trim() && !v.is_legacy) : [];
            const words = (v) => String(v.name) + " " + (v.labels && typeof v.labels === "object" ? Object.values(v.labels).join(" ") : "");
            // voices every plan can use come first, then ones copied from the voice library. In each group, warm and bright voices first
            const rank = (v) => (shared(v) ? 2 : 0) + (/warm|bright|friendly|upbeat|playful|cheer|sunny/i.test(words(v)) ? 0 : 1);
            if (all.length) return all.sort((a, b) => rank(a) - rank(b)).slice(0, 30).map(plain);
          } catch (err) { /* try the older address, then give up quietly */ }
        }
        return null;
      },
      // Plays one sentence so the voice can be judged. Called from a tap, which is what lets a phone play sound.
      async sample(key, voiceId, style) {
        if (listening) stopListening();
        if (!voiceId) {
          if (!canSpeak) return { ok: false, why: "This browser has no voice of its own." };
          prime();
          playPhone(begin(null), NATURAL.sample);
          return { ok: true };
        }
        if (!player) return { ok: false, why: "This browser cannot play the natural voice." };
        quiet();
        if (natOff) { clips.forEach((url) => URL.revokeObjectURL(url)); clips.clear(); }      // switched off: this sample must really ask ElevenLabs
        ready(true);
        const job = begin(null, true);
        const why = await playNatural(job, NATURAL.sample, key || natKey, voiceId, style === "quick" ? "quick" : "rich");
        if (current !== job) return { ok: false, why: "It was stopped before it played." };      // stopped on the way: nothing was checked
        if (why) job.done();
        if (!why && natKey && (key || natKey) === natKey && voiceId === natVoice) { natOff = false; natMisses = 0; }      // the saved voice works again
        return why ? { ok: false, why: WHY[why] } : { ok: true };
      },
      save(key, voiceId, style, aloud) {
        if (aloud === true || aloud === false) { aloudPref = aloud ? "1" : "0"; remember("ma-voice-always", aloudPref); }
        if (key) { natKey = key; remember("ma-eleven-key", key); }
        if (style) { natStyle = style === "quick" ? "quick" : "rich"; remember("ma-eleven-style", natStyle); }
        natVoice = voiceId || "";
        if (natVoice) remember("ma-eleven-voice", natVoice); else forget("ma-eleven-voice");
        natOff = false; natMisses = 0;
        if (always()) { voiceMode = true; app.classList.add("has-voice"); }
        else if (!talked) voiceMode = false;      // "After I talk" was chosen and nobody has talked: taps stay quiet too
      },
      forget() {
        hush();                              // stop a sample or an answer that is still on its way with this key
        natKey = ""; natVoice = ""; natOff = false; turnedDown.clear();
        forget("ma-eleven-key"); forget("ma-eleven-voice");
        clips.forEach((url) => URL.revokeObjectURL(url)); clips.clear(); clipsKey = "";
        if (!always() && !talked) voiceMode = false;      // no natural voice any more: taps stay quiet too
      },
    };

    // After it asks something out loud about a draft, the member will want to answer.
    // Where the browser allows it, listen once by itself after a short gap. Otherwise the mic pulses to invite a tap.
    function listenAgain() {
      if (!wantListen || speaking || busy || listening) return;      // if the card is still being built, afterTurn() tries again
      wantListen = false;
      if (!voiceMode || !talked || document.hidden) return;
      if (!activeDraft || !activeDraft.open) return;
      if (!autoOk || autoMisses > 0) { invite(); return; }
      clearTimeout(gapTimer);
      gapTimer = setTimeout(() => { if (!speaking && !busy && !listening && activeDraft && activeDraft.open) listen(true); }, 350);
    }

    /* ---- controls ---- */

    // click, not touch start: phones only allow the microphone from a finished tap
    micBtn.addEventListener("click", () => {
      if (live.on() || live.ready()) { if (listening) stopListening(); hush(); live.toggle(); return; }       // one tap starts a live conversation, the next one ends it
      if (listening) { finish(); return; }
      if (speaking && (busy || !Recognition || refused)) { hush(); return; }     // cannot listen right now: the button just stops the talking
      autoMisses = 0;
      listen(false);                          // this also stops anything being read aloud
    });
    toggleBtn.addEventListener("click", () => {
      repliesOn = !repliesOn;
      remember("ma-spoken-replies", repliesOn ? "on" : "off");
      if (!repliesOn) hush();
      showControls();
      toast(repliesOn ? "Spoken replies are on." : "Spoken replies are off. Answers are still shown.", 3500);
    });
    input.addEventListener("input", () => { stopListening(); hush(); });     // typing closes the microphone and stops anything being read aloud
    const leave = () => { live.away(); stopListening(); hush(); };       // the page is hidden: nothing keeps listening or talking
    document.addEventListener("visibilitychange", () => { if (document.hidden) leave(); });
    window.addEventListener("pagehide", leave);
    if (canSpeak) { try { synth.getVoices(); } catch (err) { /* voices load later */ } }   // ask early so the list is ready for the first reply
    showControls();

    return {
      say,
      hush,
      // a typed question: answered silently, unless answers are always read aloud. The tap or key press is what lets a phone play sound
      typed() { talked = false; voiceMode = always(); bar.classList.remove("wants-answer"); hush(); if (voiceMode) prime(); },
      cancel() { bar.classList.remove("wants-answer"); stopListening(); hush(); if (always()) { voiceMode = true; prime(); } },
      afterTurn: listenAgain,                    // called when an answer has finished arriving
      busy: () => listening || speaking,
      // Enter while it listens: send what was heard now, by the voice rules
      sendHeard() { if (!listening || stopped || !heard) return false; finish(); return true; },
      natural,
      note: (text, ms) => toast(text, ms),       // a short note above the chat bar
      clearNote: clearToast,
      labels: showControls,
      // true when the natural voice will read the next answer. It takes a moment to arrive, so it is asked for early
      early: () => voiceMode && repliesOn && naturalOn(),
      // what to say after a draft, in words that match what the microphone will do next
      hint: () => (!talked ? "" : autoOk && autoMisses === 0 ? " Tell me what to change, or say confirm." : " Tap the microphone to change something or to confirm."),
    };
  })();


  /* =========================================================
     8. A LIVE CONVERSATION
     One tap on the microphone opens a line to Carely, like a phone call. ElevenLabs runs the talking:
     it hears the member, answers in Carely's voice, and asks this page to show cards through a few "tools".
     The page stays in charge of the facts and of the safety rules:
       - every fact Carely says comes from a card this page drew
       - nothing is booked without a read back and a clear yes, and that is checked here, not by the AI
       - emergency words put the 911 card on the screen at once
       - numbers that must not be said (member ID, card numbers) are never given to Carely
     Only the ID of a public agent is needed. There is no key in the page.
     Add ?agent=off to the address to switch this off and get the older tap to talk microphone.
     ========================================================= */
  const LIVE = { agent: "" };

  live = (() => {
    let convo = null;               // the open line
    let state = "off";              // off | starting | on
    let run = 0;                    // counts attempts, so a late answer from an older one is ignored
    let turn = null;                // where the next words and cards go
    let lastLine = null;            // Carely's latest sentence on the screen
    let heard = "";                 // the member's latest words
    let said = 0;                   // how many things the member has said or typed
    let sent = "";                  // what this page last put on the line itself, so its echo is not shown twice
    let collect = null;             // while a tool confirms a draft: what the card says about it
    let trouble = "";               // the last thing the library complained about
    let meter = 0, hintTimer = 0;
    let quietUntil = 0;             // the first use note is up until then
    let hinted = false;             // the "no sound?" note was shown in this conversation
    let loud = 0;                   // how sure the service is that the member is talking right now (0 to 1)
    const agent = (() => {
      let q = "";
      try { q = new URLSearchParams(location.search).get("agent") || ""; } catch (err) { /* no address */ }
      return q === "off" ? "" : /^[A-Za-z0-9_]{8,64}$/.test(q) ? q : LIVE.agent;
    })();
    const sdk = () => (window.ElevenLabsClient && window.ElevenLabsClient.Conversation) || null;
    const ready = () => !!(agent && sdk() && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.RTCPeerConnection);
    const on = () => state !== "off";
    const recall = (key) => { try { return localStorage.getItem(key); } catch (err) { return null; } };
    const remember = (key, value) => { try { localStorage.setItem(key, value); } catch (err) { /* private mode */ } };
    // Ways to open the line. If one fails, the next tap tries the next one.
    // iPhones start with the setting ElevenLabs added for a microphone error in Safari.
    const apple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const WAYS = apple ? [{ webRtc: { singlePeerConnection: false } }, {}, { connectionType: "websocket" }] : [{}, { webRtc: { singlePeerConnection: false } }, { connectionType: "websocket" }];
    let way = 0;

    /* ---- what is on the screen ---- */

    function newTurn(text, how) {
      app.classList.add("has-flow");
      place(true);
      flow.querySelectorAll(".mod").forEach((m) => m.classList.add("is-past"));
      turn = document.createElement("article");
      turn.className = "turn";
      if (text) {
        const q = document.createElement("div");
        q.className = how === "typed" ? "ask" : "ask ask--voice";
        q.textContent = text;
        turn.appendChild(q);
        face.sent(q);
      }
      flow.appendChild(turn);
      showTurn(turn);
    }

    // Carely's words, also as text
    function says(text) {
      const line = String(text || "").trim();
      if (!line) return;
      if (!turn || !turn.isConnected) newTurn("");
      speak(turn, line);
      lastLine = turn.lastElementChild;
      const el = lastLine;
      requestAnimationFrame(() => keepInView(el, el));
      statusEl.textContent = line;
    }
    // the member talked over Carely: the text is cut back to what she really got to say
    function corrected(c) {
      const text = c && String(c.corrected_agent_response || "").trim();
      if (text && lastLine && lastLine.isConnected) lastLine.textContent = text;
    }

    // the member said or typed something
    function hears(text, how) {
      heard = text; said++;
      newTurn(text, how);
      if (isUrgent(text)) emergency(text);       // safety first, and it does not wait for the AI
    }
    // words while the member is still talking, shown where typed words would be
    function partial(e) {
      if (state !== "on" || !e || e.type !== "tentative_user_transcript" || input.value) return;
      const t = e.tentative_user_transcription_event && e.tentative_user_transcription_event.user_transcript;
      if (t && !bar.classList.contains("is-live-talking")) input.placeholder = String(t).replace(/\s+/g, " ").slice(-34);
    }

    // the 911 or 988 card goes up at once, drawn by this page
    async function emergency(text) {
      const mine = turn;
      mine.dataset.urgent = "1";
      const spec = understand(text);
      setDraft(null);
      let last = null;
      for (const ui of spec.ui || []) last = (await mount(mine, ui)) || last;
      if (last) keepInView(last, mine.firstElementChild || last);
      setChips(spec.next && spec.next.length ? spec.next : HOME_CHIPS);
      tell("The app has put the emergency card on the member's screen, with a button to call for help.");
    }

    /* ---- the tools Carely can use ---- */

    // what Carely is told about a card. Never the numbers that must not be said out loud
    function facts(spec, el) {
      const type = spec.ui && spec.ui[0] && spec.ui[0].type;
      if (type === "idcard") return "The member's ID card is on their screen now. Do not say any number from it.";
      let text = spec.say;
      if (el) {
        const seen = String(el.innerText || el.textContent || "").replace(/\s+/g, " ").replace(/\b(MBR|card ending|ending)\s*[\d ]{4,}/gi, "").trim().slice(0, 700);
        if (seen) text += " On the card: " + seen;
      }
      if (activeDraft && activeDraft.open) text += " This is a draft. Nothing is done until the member confirms.";
      return text;
    }
    const YES = /\b(yes|yeah|yep|yup|correct|right|sure|ok|okay|absolutely|definitely|perfect|sounds good|looks good|that works|go ahead|do it|book it|order it|confirm|mm hmm|uh huh)\b/;
    const NO = /\b(no|nope|not|don'?t|do not|wait|cancel|stop|change|instead|but|actually|wrong|hold on)\b/;
    const clearYes = (text) => { const t = text.toLowerCase().replace(/[^a-z' ]+/g, " ").replace(/\s+/g, " ").trim(); return t.split(" ").length <= 8 && YES.test(t) && !NO.test(t); };
    const openDraft = () => (activeDraft && activeDraft.open && activeDraft.el.isConnected ? activeDraft : null);

    const tools = {
      // show a card for a plain request, and tell Carely what is on it
      async show(args) {
        const text = String((args && args.request) || "").slice(0, 200).trim();
        if (!text) return "Nothing was shown. Ask for one specific thing.";
        if (!turn || !turn.isConnected) newTurn("");
        const mine = turn;
        let spec;
        try { spec = understand(text); } catch (err) { return "The app could not do that just now."; }
        if (spec.unknown) return "The app has nothing for that request. Offer to have a person call them, or ask what they need in other words.";
        const urgent = (spec.ui || []).some((u) => u.type === "urgent");
        if (urgent && mine.dataset.urgent) return spec.say + " The emergency card is already on their screen.";
        if (urgent) mine.dataset.urgent = "1";
        setDraft(null);
        flow.querySelectorAll(".mod").forEach((m) => m.classList.add("is-past"));
        let last = null;
        for (const ui of spec.ui || []) last = (await mount(mine, ui)) || last;
        if (last) { face.lookAtEl(last); keepInView(last, mine.firstElementChild || last); }
        setChips(spec.next && spec.next.length ? spec.next : HOME_CHIPS);
        if (!/talk to|person|wrong/.test(text.toLowerCase())) lastAsk = text;
        return facts(spec, last);
      },
      // change the draft that is open, in the member's words
      async change_draft(args) {
        const d = openDraft();
        if (!d) return "There is no draft open to change.";
        if (!d.set) return "This one can only be changed by tapping the card. " + (d.help || "");
        const edit = readEdit(String((args && args.change) || "").slice(0, 200), false);
        d.asked = false; d.askedAt = 0;          // any change means the details must be read back again
        if (!edit || edit.act !== "set") return "The app did not understand that change. " + (d.help || "");
        const changed = d.set(edit.patch);
        return (changed.length ? "Changed. It is now " : "It was already set that way: ") + d.describe() + ". Nothing is done until the member confirms.";
      },
      // Book, order or request what the draft says. The page, not the AI, makes sure of two steps:
      // first the details are read back, and only a clear yes from the member after that goes through.
      async confirm_draft() {
        const d = openDraft();
        if (!d) return "There is no draft open. Nothing was done.";
        if (d.asked && d.asked === d.readback() && said > d.askedAt && clearYes(heard)) {
          collect = [];
          try { d.confirm(); } finally { /* the card has spoken */ }
          const outcome = collect.join(" ");
          collect = null;
          return outcome || "Done. It went through.";
        }
        d.asked = d.readback(); d.askedAt = said;
        return "Not done yet. Read this back to the member and ask if it is right: " + d.readback() + " Use this tool again only after they clearly say yes.";
      },
      async cancel_draft() {
        const d = openDraft();
        if (!d) return "There is no draft open.";
        collect = [];
        try { d.skip(); } finally { /* the card has spoken */ }
        const outcome = collect.join(" ");
        collect = null;
        return outcome || "Okay. Nothing was done.";
      },
    };

    // a card's own line after a tap. Returns true when a tool caused it (then Carely gets it as the tool's answer)
    function cardSaid(text) {
      if (collect) { collect.push(text); return true; }
      put("[tapped the card] " + text);
      return false;
    }

    /* ---- the line ---- */

    // tell Carely something without asking for an answer
    function tell(text) { try { if (convo && convo.sendContextualUpdate) convo.sendContextualUpdate(text); } catch (err) { /* the line dropped */ } }
    // put words on the line as if the member said them
    function put(text) { sent = text; try { if (convo && convo.sendUserMessage) convo.sendUserMessage(text); } catch (err) { /* the line dropped */ } }
    // typed, or tapped on a chip or a card
    function send(text) {
      if (state !== "on") return false;
      hears(text, "typed");
      put(text);
      return true;
    }
    // while the member types, Carely holds back
    input.addEventListener("input", () => { try { if (state === "on" && convo && convo.sendUserActivity) convo.sendUserActivity(); } catch (err) { /* the line dropped */ } });

    function look(next) {
      if (state === "off") return;
      const talking = next === "speaking";
      bar.classList.toggle("is-live-talking", talking);
      face.voice(talking ? "talking" : "listening");
      input.placeholder = state === "starting" ? "One moment..." : talking ? "Carely is talking" : "Listening...";
      if (talking && state === "on" && !hinted) soundHint();
    }
    // Carely has started talking. The page cannot read the phone's volume, so the first few times it says what to check.
    function soundHint() {
      hinted = true;
      const times = Number(recall("ma-live-heard")) || 0;
      if (times >= 3) return;
      remember("ma-live-heard", String(times + 1));
      const mine = run;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {          // after the first use note, if that is still up
        if (mine === run && state === "on") voice.note("Carely is talking now. No sound? Turn up the volume with the buttons on the side of your phone.", 8000);
      }, Math.max(0, quietUntil - performance.now()));
    }

    // a short soft chime during the tap. It tells the member the sound is on before Carely says a word
    function chime() {
      try {
        const rate = 22050, n = Math.round(rate * 0.46), pcm = new Int16Array(n), head = new DataView(new ArrayBuffer(44));
        for (let i = 0; i < n; i++) {
          const t = i / rate, second = t >= 0.17, at = second ? t - 0.17 : t;
          pcm[i] = Math.round(7000 * Math.min(1, at / 0.008) * Math.exp(-7 * at) * Math.sin(2 * Math.PI * (second ? 880 : 660) * t));
        }
        const put4 = (o, s) => { for (let i = 0; i < 4; i++) head.setUint8(o + i, s.charCodeAt(i)); };
        put4(0, "RIFF"); head.setUint32(4, 36 + n * 2, true); put4(8, "WAVE"); put4(12, "fmt "); head.setUint32(16, 16, true); head.setUint16(20, 1, true); head.setUint16(22, 1, true);
        head.setUint32(24, rate, true); head.setUint32(28, rate * 2, true); head.setUint16(32, 2, true); head.setUint16(34, 16, true); put4(36, "data"); head.setUint32(40, n * 2, true);
        const url = URL.createObjectURL(new Blob([head, pcm], { type: "audio/wav" })), a = new Audio(url);
        a.onended = a.onerror = () => URL.revokeObjectURL(url);
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
      } catch (err) { /* no chime: the conversation still starts */ }
    }

    // The tap does three things in this order: a chime (sound is on), the microphone (asked for inside the tap,
    // and held open, which is what lets an iPhone play Carely's voice a moment later), then the line itself.
    function start() {
      if (state !== "off" || !ready()) return;
      state = "starting";
      const mine = ++run;
      turn = null; lastLine = null; heard = ""; said = 0; sent = ""; trouble = ""; hinted = false; loud = 0;
      bar.classList.add("is-calling");
      ringWake();
      input.placeholder = "One moment...";
      voice.labels();
      chime();
      if (recall("ma-live-note") !== "1") {
        remember("ma-live-note", "1");
        quietUntil = performance.now() + 10000;
        voice.note("A live conversation sends your voice to ElevenLabs, which answers as Carely. This prototype uses made up data. Please do not say real health details.", 10000);
      } else { quietUntil = 0; voice.note("Connecting to Carely. You should have heard a chime.", 20000); }
      let held = null;
      const letGo = () => { try { if (held) held.getTracks().forEach((t) => t.stop()); } catch (err) { /* already stopped */ } held = null; };
      let asking;
      try { asking = navigator.mediaDevices.getUserMedia({ audio: true }); } catch (err) { asking = Promise.reject(err); }
      Promise.resolve(asking).then((stream) => {
        held = stream;
        if (mine !== run) { letGo(); return null; }      // cancelled while the phone was asking
        return sdk().startSession(Object.assign({
          agentId: agent,
          clientTools: tools,
          stripAudioTags: true,                 // words like [laughs] are for the voice, not for the screen
          onMessage: (m) => { if (mine === run) message(m); },
          onModeChange: (m) => { if (mine === run) look(m && m.mode); },
          onInterruption: () => { if (mine === run) look("listening"); },
          onAgentResponseCorrection: (c) => { if (mine === run) corrected(c); },
          onIncomingEvent: (e) => { if (mine === run) partial(e); },
          onVadScore: (v) => { if (mine === run) loud = Number(v && v.vadScore) || 0; },
          onDisconnect: (why) => { if (mine === run) ended(why); },
          onError: (text) => { trouble = String(text || ""); },      // the library reports small things here too. A line that really drops ends in onDisconnect
          onUnhandledClientToolCall: () => {},
        }, WAYS[way]));
      }).then((line) => {
        letGo();                                // the library holds its own microphone by now
        if (!line) return;
        if (mine !== run || state !== "starting") { try { const p = line.endSession(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* already closed */ } return; }
        convo = line;
        state = "on";
        bar.classList.remove("is-calling");
        bar.classList.add("is-live");
        app.classList.add("is-live");
        const talking = bar.classList.contains("is-live-talking");
        look(talking ? "speaking" : "listening");
        syncBar();
        voice.labels();
        if ($("#toast").textContent.indexOf("Connecting") === 0) voice.clearNote();
        watch();
      }, (err) => {
        letGo();
        if (mine !== run) return;
        const name = err && err.name, why = String((err && err.message) || err || "").replace(/\s+/g, " ").slice(0, 150);
        const refused = /conversation token|\b40[13]\b|origin|authentication/i.test(why);      // the service said no to this page, not the phone to the microphone
        if (!refused) way = (way + 1) % WAYS.length;        // the next tap tries another way to open the line
        stop(refused ? "This address is not allowed to start a conversation yet. (" + why + ")"
          : name === "NotAllowedError" || name === "SecurityError" || /not allowed|permission/i.test(why)
          ? "I could not use the microphone. Tap to try again. If it keeps failing, allow the microphone for this site in your browser's settings."
          : name === "NotFoundError" ? "I could not find a microphone on this device."
          : "I could not start the conversation. Tap to try again." + (why ? " (" + why + ")" : ""));
      });
    }

    // words arrive: the member's as the service heard them, and Carely's
    function message(m) {
      if (state === "off" || !m) return;
      const text = String(m.message || "").trim(), who = m.role || m.source;
      if (!text) return;
      if (who === "user") {
        if (text === sent) { sent = ""; return; }      // this page put it on the line itself, and already showed it
        if (text.charAt(0) === "[") return;            // a note about a tap, not something to show
        hears(text, "voice");
      } else says(text);
    }

    // The green light and the rings follow who is talking. The library's volume meters add a little life where
    // they work. On iPhones they stay at zero, so the look never depends on them.
    function watch() {
      cancelAnimationFrame(meter);
      const tick = () => {
        if (state !== "on" || !convo) return;
        let out = 0, mic = 0;
        try { out = convo.getOutputVolume ? convo.getOutputVolume() : 0; mic = convo.getInputVolume ? convo.getInputVolume() : 0; } catch (err) { /* no levels */ }
        const talking = bar.classList.contains("is-live-talking");
        bar.style.setProperty("--live-out", Math.max(talking ? 0.6 : 0, Math.min(1, out * 1.6)).toFixed(2));
        bar.classList.toggle("is-hearing", !talking && (mic > 0.12 || loud > 0.6));
        meter = requestAnimationFrame(tick);
      };
      meter = requestAnimationFrame(tick);
    }

    // the line closed: by the member, by Carely, or because something went wrong
    function ended(why) {
      if (state === "off") return;
      const ctx = (why && why.context) || {};
      const reason = why ? [why.reason, why.message, why.closeReason, ctx.reason, ctx.type, why.reason === "error" ? trouble : ""].filter(Boolean).join(" ").replace(/\s+/g, " ") : "";
      stop(why && why.reason === "user" ? ""
        : /quota|credit|payment|out of|exceeds your/i.test(reason) ? "The conversation ended. The ElevenLabs account is out of minutes."
        : /max_duration/i.test(reason) ? "That was as long as one conversation can be. Tap the microphone to start another."
        : why && why.reason === "error" ? "The conversation stopped. Tap the microphone to try again. (" + reason.slice(0, 140) + ")"
        : "The conversation ended. Tap the microphone to talk again.");
    }

    // close the line and put the bar back
    function stop(note) {
      if (state === "off") return;
      const line = convo;
      run++;
      state = "off"; convo = null; collect = null;
      cancelAnimationFrame(meter);
      clearTimeout(hintTimer);
      if (line) { try { const p = line.endSession(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* already closed */ } }
      bar.classList.remove("is-live", "is-calling", "is-live-talking", "is-hearing");
      app.classList.remove("is-live");
      bar.style.removeProperty("--live-out");
      face.voice("");
      input.placeholder = activeDraft && activeDraft.set ? "Any changes?" : "Ask Carely";
      ringSleep();
      syncBar();
      voice.labels();
      if (note) voice.note(note, 9000); else voice.clearNote();
      statusEl.textContent = note || "The conversation has ended.";
    }

    return { ready, on, send, stop, cardSaid, toggle: () => (state === "off" ? start() : stop("")), tools,
      away: () => { if (state !== "off") stop("The conversation ended when you left this page. Tap the microphone to talk again."); } };
  })();
  voice.labels();                                           // the microphone button says what it will do
  window.addEventListener("load", () => voice.labels());    // and again once the library has arrived


  /* =========================================================
     9. VOICE FIRST
     Talking is the whole experience. The chat bar is something the member can switch on or off.
     With the chat bar off, the bar folds into a round Carely. One tap on her starts talking, the next ends it.
     On the home screen she sits big in the middle. When a conversation starts she moves down to make room.
     The keyboard button brings the chat bar back for typing. The choice is remembered on this device.
     Add ?bar=on or ?bar=off to the address to force one layout.
     ========================================================= */
  const typeBtn = $("#typeToggle"), orbit = $("#orbit"), deck = $("#deck"), heroSlot = $("#heroSlot");
  const orbLine = $("#orbLine"), orbWords = $("#orbWords"), orbTip = $("#orbTip");
  function canTalk() { return live.ready() || !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

  // the words under Carely: what is happening, or what the member is saying
  const ORB_KNOWN = ["Ask Carely", "Any changes?", "One moment...", "Listening...", "Carely is talking"];
  function syncOrb() {
    const has = (c) => bar.classList.contains(c);
    const onLine = has("is-live") || has("is-calling");
    app.classList.toggle("is-busy", has("is-listening") || has("is-speaking") || onLine);
    if (!app.classList.contains("voice")) return;
    const heard = input.value.trim(), hint = input.placeholder, idle = hint === "Ask Carely" || hint === "Any changes?";
    let words, mine = false, tip = "";
    if (heard) { words = heard; mine = true; }                                      // the member's words, as they are heard
    else if (!idle && ORB_KNOWN.indexOf(hint) < 0) { words = hint; mine = true; }   // on the line they arrive in the hint
    else if (!idle) { words = hint; tip = hint === "One moment..." ? "" : onLine ? "Tap to end" : "Tap to stop"; }
    else if (has("is-speaking")) { words = "Carely is talking"; tip = "Tap to stop"; }
    else if (has("is-thinking")) words = "One moment...";
    else if (has("wants-answer")) words = "Tap to answer";
    else words = "Tap to talk";
    if (orbWords.textContent !== words) orbWords.textContent = words;
    if (orbTip.textContent !== tip) orbTip.textContent = tip;
    orbLine.classList.toggle("is-mine", mine);
    const name = $("#mic").getAttribute("aria-label") || "";
    avatarBtn.setAttribute("aria-label", !name || name === "Talk instead of typing" ? "Talk with Carely" : name);
  }

  // Carely's place: the middle of the home screen while nothing has been asked, else the dock at the bottom.
  // She is one element. It is moved, and the move is shown as a glide from where she was.
  function place(glide) {
    const hero = app.classList.contains("voice") && !app.classList.contains("has-flow");
    const want = hero ? heroSlot : deck;
    if (app.classList.contains("hero") === hero && orbit.parentNode === want) return;
    const from = bar.getBoundingClientRect();
    const held = orbit.contains(document.activeElement) ? document.activeElement : null;
    bar.style.transition = "none";                   // her size changes at once here. The glide below shows the change
    app.classList.toggle("hero", hero);
    if (orbit.parentNode !== want) { if (hero) heroSlot.appendChild(orbit); else deck.insertBefore(orbit, typeBtn); }
    if (held && document.activeElement !== held) held.focus({ preventScroll: true });      // moving her must not drop the keyboard's place
    face.resize();
    syncGlass();
    const to = bar.getBoundingClientRect();
    bar.style.transition = "";
    sizeLastTurn();
    if (!glide || reduceMotion.matches || !bar.animate || !from.width || !to.width) return;
    const round = Math.abs(from.width - from.height) < 2 && Math.abs(to.width - to.height) < 2;
    const dx = from.left + from.width / 2 - (to.left + to.width / 2), dy = from.top + from.height / 2 - (to.top + to.height / 2);
    const frames = round
      ? [{ transform: "translate(" + dx.toFixed(1) + "px, " + dy.toFixed(1) + "px) scale(" + (from.width / to.width).toFixed(3) + ")" }, { transform: "none" }]
      : [{ opacity: 0, transform: "scale(0.84)" }, { opacity: 1, transform: "none" }];      // bar to round Carely, or back: she simply arrives
    bar.animate(frames, { duration: round ? 640 : 380, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
    if (orbLine.animate) orbLine.animate([{ opacity: 0 }, { opacity: 0, offset: 0.45 }, { opacity: 1 }], { duration: 640, easing: "ease-out" });
  }

  function showBar(on, focus) {
    const voiceFirst = !on;
    if (voiceFirst && !canTalk()) return;            // nothing to talk with here: the chat bar stays
    app.classList.toggle("voice", voiceFirst);
    typeBtn.setAttribute("aria-label", on ? "Hide the chat bar" : "Show the chat bar");
    if (voiceFirst && document.activeElement === input) input.blur();
    face.center(voiceFirst);
    place(true);
    syncBar();
    syncOrb();
    if (on && focus) input.focus({ preventScroll: true });
  }
  typeBtn.addEventListener("click", () => {
    const on = app.classList.contains("voice");      // voice layout now, so the tap switches the bar on
    try { localStorage.setItem("ma-chat-bar", on ? "on" : "off"); } catch (err) { /* private mode */ }
    showBar(on, on);
  });
  // the words follow the text box's hint and the bar's state, which the voice code already keeps up to date
  if (window.MutationObserver) {
    new MutationObserver(syncOrb).observe(input, { attributes: true, attributeFilter: ["placeholder"] });
    new MutationObserver(syncOrb).observe(bar, { attributes: true, attributeFilter: ["class"] });
  }
  // the face is drawn from the bar's height, so it follows the bar while it folds and unfolds
  if (window.ResizeObserver) new ResizeObserver(() => { face.resize(); syncGlass(); }).observe(bar);

  // the greeting says how many things are waiting today
  function syncHello() {
    const body = $("#nudge .mod__body");
    if (!body) return;
    const left = Array.from(body.querySelectorAll("button.item")).filter((b) => b.style.display !== "none").length;
    const count = ["", "one thing", "two things", "three things"][left] || left + " things";
    $("#helloSub").textContent = left ? "I have " + count + " for you today." : "What do you need today?";
  }

  // which layout to start in: what the address says, else what was chosen before, else voice first wherever the phone can listen
  function startLayout() {
    let asked = "";
    try { asked = new URLSearchParams(location.search).get("bar") || ""; } catch (err) { /* no address */ }
    const first = () => {
      let stored = "";
      try { stored = localStorage.getItem("ma-chat-bar") || ""; } catch (err) { /* private mode */ }
      const can = canTalk();
      const want = asked === "on" || asked === "off" ? asked : stored === "on" || stored === "off" ? stored : "off";
      typeBtn.hidden = !can;
      app.classList.toggle("has-toggle", can);
      const on = want === "on" || !can;
      app.classList.toggle("voice", !on);
      typeBtn.setAttribute("aria-label", on ? "Hide the chat bar" : "Show the chat bar");
      face.center(!on);
      place(false);
      syncBar();
      syncOrb();
    };
    first();
    window.addEventListener("load", () => { if (typeBtn.hidden === canTalk()) first(); });      // the library arrives after this script, and it can decide whether talking is possible
  }

  // typing on a real keyboard brings the chat bar by itself. The key lands in the text box, because the box has focus before the letter is typed
  document.addEventListener("keydown", (e) => {
    if (!app.classList.contains("voice") || e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.key.length !== 1 || e.key === " ") return;
    const t = e.target;
    if (t && t.closest && t.closest("input, textarea, select, [contenteditable]")) return;
    showBar(true, true);
  });

  /* ---- start ---- */
  // the app manifest only works from a web address, so skip it when this is opened as a plain file
  if (location.protocol.indexOf("http") === 0) {
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = "manifest.webmanifest";
    document.head.appendChild(link);
  }
  const now = new Date();
  $("#today").textContent = fmt(now, { weekday: "long", month: "long", day: "numeric" });
  const hour = now.getHours();
  $("#greetingLine").textContent = `Good ${hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening"}, ${MEMBER.first}.`;

  const today = MODULES.today({}, api(null));
  stagger(today);
  today.classList.add("is-built");
  $("#nudge").appendChild(today);
  syncHello();
  if (window.MutationObserver) new MutationObserver(syncHello).observe($("#nudge"), { childList: true, subtree: true, attributes: true, attributeFilter: ["style"] });
  startLayout();

  setChips(HOME_CHIPS);
  onResize();
  syncGlass();
  face.start();

  // small hook so this can be wired to a real model later
  window.MemberAssistant = { ask, understand, MODULES, live };
})();
</script>
</body>
