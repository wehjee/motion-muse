  /* ---- add to calendar (makes a real .ics file) ---- */
  function saveCalendarFile(day, time, title, place, reason) {
    const [, hh, mm, ap] = time.match(/(\d+):(\d+)\s*(AM|PM)/);
    const start = new Date(day);
    start.setHours((+hh % 12) + (ap === "PM" ? 12 : 0), +mm, 0, 0);
    const end = new Date(start.getTime() + 30 * 60000);
    const stamp = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
    const clean = (s) => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, " ");
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Member assistant prototype//EN", "BEGIN:VEVENT",
      `UID:${Date.now()}@member-assistant.example`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`,
      `SUMMARY:${clean(title)}`, `LOCATION:${clean(place)}`, `DESCRIPTION:${clean("Reason: " + reason)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    try {
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      const a = document.createElement("a");
      a.href = url; a.download = "appointment.ics";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      statusEl.textContent = "Calendar file saved.";
    } catch (err) { statusEl.textContent = "Could not save the calendar file here."; }
  }

  /* =========================================================
     4. THE CONVERSATION
     ========================================================= */

  let busy = false;
  let lastAsk = "";

  let contextChips = [];
  let shownChips = "";
  function drawChips(list) {
    const key = list.join("|");
    if (key === shownChips) return;
    shownChips = key;
    chipsEl.innerHTML = "";
    list.slice(0, 8).forEach((label, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = label;
      b.style.setProperty("--i", i);
      b.addEventListener("click", () => { input.value = ""; syncBar(); ask(label); });
      chipsEl.appendChild(b);
    });
    chipsEl.scrollLeft = 0;
  }
  // chips that fit the moment (after an answer, or on the home screen)
  function setChips(list) {
    contextChips = list || [];
    if (!input.value.trim()) drawChips(contextChips);
  }

  // while the member types, the chips guess what they mean
  const PHRASES = ["Schedule a visit", "Schedule a video visit", "Schedule my yearly checkup", "Find a dermatologist", "Find a therapist",
    "Find a physical therapist", "Find urgent care near me", "Is physical therapy covered?", "Is an MRI covered?", "Is acupuncture covered?",
    "Where is my claim?", "Show my ID card", "My deductible", "Refill my prescription", "Talk to a person", "Talk to a nurse",
    "What will an MRI cost?", "Is my MRI approved?"];
  function predict(text) {
    const words = text.toLowerCase().replace(/[?.,!]/g, "").split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    const scored = [];
    for (const phrase of PHRASES) {
      const parts = phrase.toLowerCase().replace(/[?]/g, "").split(" ");
      let score = 0, ok = true;
      for (const w of words) {
        const at = parts.findIndex((x) => x.startsWith(w));
        if (at < 0) { ok = false; break; }
        score += 10 - at;
      }
      if (ok && phrase.toLowerCase().replace(/[?]/g, "") !== words.join(" ")) scored.push([score, phrase]);
    }
    return scored.sort((a, b) => b[0] - a[0]).slice(0, 3).map((x) => x[1]);
  }
  // chips and the swipe row: a focused item scrolls into view, and a mouse wheel scrolls the chips sideways
  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (t.closest && t.closest(".chips, .strip") && t.matches(":focus-visible")) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
  chipsEl.addEventListener("wheel", (e) => {
    if (e.deltaX || !e.deltaY || chipsEl.scrollWidth <= chipsEl.clientWidth) return;
    chipsEl.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive: false });

  function syncChips() {
    const text = input.value.trim();
    if (!text) return drawChips(contextChips);
    const guesses = predict(text);
    drawChips(guesses.length ? guesses : contextChips);
  }

  const dock = $(".dock");
  let dockH = 150;
  function sizeLastTurn() {
    dockH = dock.offsetHeight;
    app.style.setProperty("--dock-h", dockH + "px");
    flow.style.setProperty("--turn-min", Math.max(0, page.clientHeight - dockH - 64) + "px");
  }
  function showTurn(turn) {
    sizeLastTurn();
    turn.scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "auto" : "smooth" });
  }
  // scroll just enough to show el, but never push `anchor` off the top
  function keepInView(el, anchor = el) {
    const r = el.getBoundingClientRect(), a = anchor.getBoundingClientRect(), p = page.getBoundingClientRect();
    const need = r.bottom - (p.bottom - dockH) + 24, room = a.top - p.top - 44;
    if (need > 0 && room > 0) page.scrollBy({ top: Math.min(need, room), behavior: reduceMotion.matches ? "auto" : "smooth" });
  }

  // the assistant's sentence arrives word by word
  function speak(turn, text, extraClass = "") {
    const p = document.createElement("p");
    p.className = "say " + extraClass;
    const words = text.split(" ");
    words.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w"; s.style.setProperty("--i", i); s.textContent = w;
      p.appendChild(s);
      if (i < words.length - 1) p.appendChild(document.createTextNode(" "));
    });
    turn.appendChild(p);
    setTimeout(() => { if (p.isConnected) p.textContent = text; }, reduceMotion.matches ? 0 : words.length * 34 + 600);
    return wait(pace(Math.min(900, words.length * 34 + 200)));
  }

  // a card is composed first (soft bars), then its parts arrive
  async function mount(turn, ui) {
    const make = MODULES[ui.type];
    if (!make) return null;                                  // unknown card types are ignored, never drawn
    const el = make(ui.props || {}, api(turn));
    const cards = el.classList.contains("mod") ? [el] : [...el.querySelectorAll(".mod")];
    cards.forEach((c) => { stagger(c); if (!reduceMotion.matches) c.classList.add("is-composing"); });
    turn.appendChild(el);
    await wait(pace(420));
    cards.forEach((c) => { c.classList.remove("is-composing"); c.classList.add("is-built"); });
    el.querySelectorAll("[data-fill]").forEach((i) => requestAnimationFrame(() => (i.style.width = i.dataset.fill + "%")));
    return el;
  }

  // the newest unconfirmed card. The chat bar can change it or confirm it.
  let activeDraft = null;
  const liveDrafts = {};
  function setDraft(d) {
    if (d) {
      const old = liveDrafts[d.kind];
      if (old && old !== d && old.open && old.el.isConnected) {
        old.open = false;
        old.el.classList.add("is-muted");
        const pill = old.el.querySelector(".pill"); if (pill) pill.textContent = "Replaced";
        old.el.querySelectorAll("input").forEach((i) => (i.disabled = true));
        const acts = old.el.querySelector(".mod__actions"); if (acts) acts.innerHTML = "";
      }
      liveDrafts[d.kind] = d;
    }
    activeDraft = d;
    input.placeholder = d && d.set ? "Tell me what to change" : "Ask anything";
  }
  const DAY_RE = [/\bsun(day)?\b/, /\bmon(day)?\b/, /\btue(s|sday)?\b/, /\bwed(nesday)?\b/, /\bthu(r|rs|rsday)?\b/, /\bfri(day)?\b/, /\bsat(urday)?\b/];
  // only a whole short message counts as yes or no. "ok but make it thursday" is an edit.
  const whole = (words) => new RegExp("^(please )?(" + words + ")(( and)?[ ,.!]+(" + words + "|please|thanks|thank you|it|that))*[ .!]*$");
  const YES = whole("yes|yep|yeah|sure|ok|okay|confirm|confirm it|book it|book that|schedule it|order it|looks good|do it|go ahead|that works|sounds good|perfect");
  const NO = whole("no|nope|cancel|cancel it|never ?mind|not now|stop|forget it|do not book it|don.?t book it|do not order it|don.?t order it");
  function readEdit(text) {
    const d = activeDraft;
    if (!d || !d.open || !d.el.isConnected) return null;
    let t = text.toLowerCase().trim();
    if (YES.test(t)) return { act: "confirm" };
    if (NO.test(t)) return { act: "skip" };
    t = t.replace(/^(yes|yep|yeah|sure|ok|okay)\b[\s,.!]*(but\s+)?/, "");      // drop a leading "ok," and read the rest
    if (YES.test(t)) return { act: "confirm" };
    if (NO.test(t)) return { act: "skip" };
    const lost = () => (understand(text).unknown ? { act: "help" } : null);      // keep the draft when the message means nothing else
    if (d.kind === "refill") {
      const patch = {};
      if (/\b90\b|three months|3 months/.test(t)) patch.supply = 90;
      else if (/\b30\b|one month|1 month/.test(t)) patch.supply = 30;
      if (/mail|deliver|ship/.test(t)) patch.how = "mail";
      else if (/pick ?up|pharmacy|in person/.test(t)) patch.how = "pickup";
      return Object.keys(patch).length ? { act: "set", patch } : lost();
    }
    if (d.kind !== "visit") return lost();
    if (/^(and |so |but )?(how much|what (does|will|would|do) (it|this|that|i) (cost|pay|owe))/.test(t) && !/mri|scan|claim|deductible|therap|cover/.test(t)) return { act: "tell", line: d.costLine() };
    if (/schedul|book|find|cover|claim|id card|deductible|refill|talk to|show my|how much|what is/.test(t)) return null;
    const s = d.state(), patch = {};
    if (/\b(no|not|without)( a)? video|in.?person|office|face to face/.test(t)) patch.video = false;
    else if (/video|virtual|online|telehealth/.test(t)) patch.video = true;
    // the day the member wants: skip days they ruled out ("thursday instead of friday"), and take the last one named
    const said = t.replace(/\b(not|instead of|rather than|from)\s+(on\s+)?\w+/g, " ");
    let at = -1;
    DAY_RE.forEach((re, i) => { const hit = said.match(re), k = s.days.findIndex((x) => x.getDay() === i); if (hit && k >= 0 && hit.index > at) { at = hit.index; patch.day = k; } });
    let rest = t;
    if (/\b(next day|day later|day after|push it)\b/.test(t)) { patch.day = s.day + 1; rest = rest.replace(/day later/, ""); }
    else if (/\bday (before|earlier)\b|sooner|soonest/.test(t)) { patch.day = s.day - 1; rest = rest.replace(/day earlier/, ""); }
    else if (/tomorrow/.test(t)) patch.day = 0;
    else if (/next week/.test(t)) { const k = s.days.findIndex((x, i) => i > 0 && x.getDay() === 1); if (k >= 0) patch.day = k; }
    const onDay = SLOTS[clamp(patch.day != null ? patch.day : s.day, 0, 4)];
    const clock = onDay.findIndex((x) => new RegExp("(^|[^\\d])" + x.replace(/ (AM|PM)$/, "") + "\\b").test(rest));   // "make it 10:30"
    if (clock >= 0) patch.slot = clock;
    else if (/\bmorning\b|\bearly\b/.test(rest)) patch.slot = 0;
    else if (/afternoon|evening|after work|end of day/.test(rest)) patch.slot = 2;
    else if (/\bnoon\b|midday|lunch/.test(rest)) patch.slot = 1;
    else if (/\bearlier\b/.test(rest)) patch.slot = s.slot - 1;
    else if (/later/.test(rest)) patch.slot = s.slot + 1;
    const why = REASONS.find(([re]) => re.test(t));
    if (why) patch.reason = why[1];
    return Object.keys(patch).length ? { act: "set", patch } : lost();
  }

  // a short exchange about the card that is already on screen (no new card)
  async function editInPlace(text, edit) {
    const d = activeDraft, turn = d.el.closest(".turn") || flow.lastElementChild;
    busy = true;
    try {
    const q = document.createElement("div");
    q.className = "ask"; q.style.marginTop = "18px"; q.textContent = text;
    turn.appendChild(q);
    face.sent(q);
    const glide = reduceMotion.matches ? "auto" : "smooth";
    if (edit.act === "help" || edit.act === "tell") {
      const line = edit.act === "tell" ? edit.line : d.help;
      await speak(turn, line, "say--after");
      turn.lastElementChild.scrollIntoView({ block: "end", behavior: glide });
      statusEl.textContent = line;
    } else if (edit.act === "set") {
      const changed = d.set(edit.patch);
      const line = changed.length ? `Done. It is now ${d.describe()}. Confirm when you are ready.` : "It is already set that way. Confirm when you are ready.";
      const row = d.el.querySelector(".row.flash") || d.el;
      row.scrollIntoView({ block: "center", behavior: glide });
      await wait(pace(350));
      await speak(turn, line, "say--after");
      turn.lastElementChild.scrollIntoView({ block: "end", behavior: glide });     // the reply stops just above the chat bar
      statusEl.textContent = line;
      face.lookAtEl(row);
    } else if (edit.act === "confirm") d.confirm();
    else d.skip();
    } finally { busy = false; }
    return true;
  }

  // what a card is allowed to do
  function api(turn) {
    return {
      draft: (d) => setDraft(d),
      ask: (text) => ask(text),
      say: (text, next) => {
        speak(turn, text, "say--after");
        const line = turn.lastElementChild;
        requestAnimationFrame(() => keepInView(line, line));
        if (next) setChips(next);
        statusEl.textContent = text;
      },
      celebrate: (el) => face.happy(el),
      lastTopic: () => lastAsk,
    };
  }

  async function ask(raw) {
    const text = String(raw || "").trim();
    if (!text || busy) return false;
    if (window.matchMedia("(pointer: coarse)").matches) input.blur();     // on phones, put the keyboard away so the card has room
    const edit = isUrgent(text) ? null : readEdit(text);   // safety always wins over an open draft
    if (edit) return editInPlace(text, edit);
    busy = true;
    try {
    app.classList.add("has-flow");
    setDraft(null);                                   // a new request: older drafts can still be tapped, but typing no longer changes them
    flow.querySelectorAll(".mod").forEach((m) => m.classList.add("is-past"));

    const turn = document.createElement("article");
    turn.className = "turn";
    const q = document.createElement("div");
    q.className = "ask";
    q.textContent = text;
    turn.appendChild(q);
    flow.appendChild(turn);
    showTurn(turn);
    face.sent(q);

    let spec;
    try { spec = understand(text); }
    catch (err) { spec = { say: "Something went wrong on my side. Please try again.", ui: [], next: HOME_CHIPS }; }
    if (!/talk to|person|wrong/.test(text.toLowerCase())) lastAsk = text;

    await wait(pace(260));
    face.think(true);
    await wait(pace(rand(320, 520)));
    await Promise.race([speak(turn, spec.say), wait(pace(380))]);     // the card starts while the sentence is still arriving
    let last = null;
    for (const ui of spec.ui || []) last = (await mount(turn, ui)) || last;
    face.think(false);
    if (last) face.lookAtEl(last);
    setChips(spec.next && spec.next.length ? spec.next : HOME_CHIPS);
    statusEl.textContent = spec.say + (last ? " A card was added below." : "");
    // if a chip or button was used with the keyboard, do not leave focus on nothing
    if (document.activeElement === document.body) {
      const line = turn.querySelector(".say");
      if (line) { line.tabIndex = -1; line.focus({ preventScroll: true }); }
    }
    } finally { busy = false; face.think(false); }
    return true;
  }

  function goHome() {
    if (busy) return;
    flow.innerHTML = "";
    setDraft(null);
    app.classList.remove("has-flow");
    page.scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
    setChips(HOME_CHIPS);
    lastAsk = "";
    statusEl.textContent = "Back at the start.";
  }

  /* =========================================================
     5. THE AVATAR  (eyes that blink, look around and react)
     ========================================================= */

  const face = (() => {
    const REST = { x: -0.78, y: 0 };
    const eyes = { x: REST.x, y: REST.y, vx: 0, vy: 0, tx: REST.x, ty: REST.y, lid: 0, lidTarget: 0, open: 1, openTarget: 1, hop: 0, hopV: 0, glow: 0.85, glowTarget: 0.85 };
    let mode = "idle";            // idle | follow | typing | thinking
    let running = false, lastT = 0, H = 68;

    function readSize() { H = parseFloat(getComputedStyle(bar).height) || 68; }

    function render() {
      const gx = eyes.x, gy = eyes.y, K = 0.2;
      const w0 = 0.32 * H, gap = 0.085 * H;
      const wl = w0 * (1 + K * gx), wr = w0 * (1 - K * gx), total = 2 * w0 + gap;
      const shiftX = (gx < 0 ? 0.13 : 0.085) * H * gx;
      const shiftY = 0.085 * H * gy + eyes.hop * H;
      const lx = -total / 2 + wl / 2 + shiftX, rx = total / 2 - wr / 2 + shiftX;
      const lidScale = Math.max(0.06, (1 - eyes.lid) * eyes.open * (1 - 0.05 * Math.abs(gy)));
      const tilt = 4 * gx;
      eyeL.style.transform = `translate(${lx.toFixed(2)}px, ${shiftY.toFixed(2)}px) rotate(${(-tilt * 0.9).toFixed(2)}deg) scale(${(wl / w0).toFixed(3)}, ${lidScale.toFixed(3)})`;
      eyeR.style.transform = `translate(${rx.toFixed(2)}px, ${shiftY.toFixed(2)}px) rotate(${(-tilt * 1.6).toFixed(2)}deg) scale(${(wr / w0).toFixed(3)}, ${lidScale.toFixed(3)})`;
      avatarEl.style.setProperty("--glow", eyes.glow.toFixed(3));
      avatarEl.style.setProperty("--pulse", (1 + (eyes.glow - 0.85) * 0.12).toFixed(4));
    }

    function step(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
      lastT = t;
      const stiff = mode === "follow" ? 170 : 120, damp = mode === "follow" ? 22 : 17;
      eyes.vx += ((eyes.tx - eyes.x) * stiff - eyes.vx * damp) * dt;
      eyes.vy += ((eyes.ty - eyes.y) * stiff - eyes.vy * damp) * dt;
      eyes.x += eyes.vx * dt; eyes.y += eyes.vy * dt;
      const lidSpeed = eyes.lidTarget > eyes.lid ? 18 : 11;
      eyes.lid += (eyes.lidTarget - eyes.lid) * Math.min(1, lidSpeed * dt * 1.6);
      eyes.open += (eyes.openTarget - eyes.open) * Math.min(1, 9 * dt);
      eyes.glow += (eyes.glowTarget - eyes.glow) * Math.min(1, 5 * dt);
      eyes.hopV += (-eyes.hop * 260 - eyes.hopV * 14) * dt;
      eyes.hop += eyes.hopV * dt;
      if (mode === "thinking") {
        const s = t / 1000;
        eyes.tx = -0.35 + Math.sin(s * 2.4) * 0.42;
        eyes.ty = -0.72 + Math.sin(s * 4.8) * 0.06;
        eyes.glowTarget = 0.95 + Math.sin(s * 5) * 0.12;
      }
      render();
      const settled = mode !== "thinking" &&
        Math.abs(eyes.tx - eyes.x) < 0.002 && Math.abs(eyes.ty - eyes.y) < 0.002 &&
        Math.abs(eyes.vx) < 0.01 && Math.abs(eyes.vy) < 0.01 &&
        Math.abs(eyes.lidTarget - eyes.lid) < 0.005 && Math.abs(eyes.openTarget - eyes.open) < 0.005 &&
        Math.abs(eyes.glowTarget - eyes.glow) < 0.005 && Math.abs(eyes.hop) < 0.0005 && Math.abs(eyes.hopV) < 0.005;
      if (settled) { running = false; return; }
      requestAnimationFrame(step);
    }
    function wake() { if (running) return; running = true; lastT = performance.now(); requestAnimationFrame(step); }

    function lookAt(x, y) { eyes.tx = clamp(x, -1, 1); eyes.ty = clamp(y, -1, 1); wake(); }
    function lookAtPoint(px, py) {
      const r = bar.getBoundingClientRect();
      const dx = px - (r.right - H * 0.55), dy = py - (r.top + r.height / 2);
      const nx = dx / (Math.abs(dx) + Math.max(140, window.innerWidth * 0.22));
      const ny = dy / (Math.abs(dy) + Math.max(110, window.innerHeight * 0.2));
      lookAt(nx * 1.25, ny * 1.25);
    }
    function lookAtEl(el) {
      if (reduceMotion.matches || !el) return;
      const r = el.getBoundingClientRect();
      lookAtPoint(r.left + Math.min(r.width, 300) / 2, r.top + Math.min(r.height, 300) / 2);
      blink(1, 70);
    }

    let blinkTimer = 0;
    function blink(times = 1, hold = 70) {
      if (eyes.lidTarget === 1) return;
      let n = times;
      const once = () => {
        eyes.lidTarget = 1; wake();
        setTimeout(() => { eyes.lidTarget = 0; wake(); if (--n > 0) setTimeout(once, 150); }, hold);
      };
      once();
    }
    function scheduleBlink() {
      clearTimeout(blinkTimer);
      blinkTimer = setTimeout(() => {
        if (!document.hidden) { if (reduceMotion.matches) blink(1, 140); else blink(Math.random() < 0.16 ? 2 : 1, rand(60, 90)); }
        scheduleBlink();
      }, reduceMotion.matches ? rand(5000, 8000) : rand(2200, 5600));
    }

    let wanderTimer = 0;
    function wander() {
      clearTimeout(wanderTimer);
      if (reduceMotion.matches) return;
      wanderTimer = setTimeout(() => {
        if (mode === "idle" && !document.hidden) {
          const roll = Math.random();
          let x, y;
          if (roll < 0.3) { x = REST.x + rand(-0.12, 0.12); y = rand(-0.1, 0.1); }
          else if (roll < 0.52) { x = rand(-0.12, 0.12); y = rand(-0.08, 0.08); }
          else if (roll < 0.78) { x = rand(-0.9, -0.2); y = rand(-0.85, -0.35); }
          else if (roll < 0.9) { x = rand(0.35, 0.8); y = rand(-0.4, 0.25); }
          else { x = rand(-1, -0.5); y = rand(0.2, 0.6); }
          const far = Math.hypot(x - eyes.x, y - eyes.y) > 0.9;
          lookAt(x, y);
          if (far && Math.random() < 0.45) blink(1, 60);
          if (Math.random() < 0.22) setTimeout(() => { if (mode === "idle") lookAt(x + rand(-0.25, 0.25), y + rand(-0.2, 0.2)); }, rand(260, 520));
        }
        wander();
      }, rand(1100, 3400));
    }

    function setMode(next) {
      mode = next;
      if (next === "idle") { eyes.glowTarget = 0.85; eyes.openTarget = document.activeElement === input ? 1.05 : 1; }
      wake();
    }

    let followTimer = 0;
    function follow(px, py) {
      // the bright spot on the glass slides toward the pointer
      const br = bar.getBoundingClientRect();
      bar.style.setProperty("--lx", clamp(((px - br.left) / br.width) * 100, 4, 78).toFixed(1) + "%");
      if (reduceMotion.matches || mode === "thinking") return;
      mode = "follow";
      lookAtPoint(px, py);
      clearTimeout(followTimer);
      followTimer = setTimeout(() => {
        if (mode !== "follow") return;
        if (document.activeElement === input && input.value) { setMode("typing"); watchCaret(); } else setMode("idle");
      }, 1500);
    }

    const measure = document.createElement("canvas").getContext("2d");
    function watchCaret() {
      if (reduceMotion.matches) return;
      const cs = getComputedStyle(input), r = input.getBoundingClientRect();
      measure.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const pos = input.selectionStart == null ? input.value.length : input.selectionStart;
      const w = measure.measureText(input.value.slice(0, pos)).width;
      lookAtPoint(r.left + clamp(w - input.scrollLeft, 0, r.width) + 6, r.top + r.height * 0.62);
    }

    window.addEventListener("pointermove", (e) => { if (e.pointerType !== "touch") follow(e.clientX, e.clientY); }, { passive: true });
    window.addEventListener("pointerdown", (e) => follow(e.clientX, e.clientY), { passive: true });
    window.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) follow(t.clientX, t.clientY); }, { passive: true });
    document.documentElement.addEventListener("pointerleave", () => { if (mode === "follow") setMode("idle"); });

    input.addEventListener("focus", () => { eyes.openTarget = 1.05; if (mode !== "thinking") { setMode(input.value ? "typing" : "idle"); watchCaret(); } });
    input.addEventListener("blur", () => { eyes.openTarget = 1; if (mode === "typing") setMode("idle"); wake(); });
    input.addEventListener("input", () => {
      if (mode === "thinking") return;
      setMode("typing"); watchCaret();
      if (!reduceMotion.matches) eyes.hopV -= 0.22;
      wake();
    });
    ["keyup", "click", "select"].forEach((ev) => input.addEventListener(ev, () => { if (mode === "typing") watchCaret(); }));

    const onMotionPref = () => {
      if (reduceMotion.matches) { clearTimeout(wanderTimer); mode = "idle"; lookAt(REST.x, REST.y); } else wander();
      scheduleBlink();
    };
    if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", onMotionPref);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { scheduleBlink(); wander(); wake(); } });

    return {
      start() { readSize(); render(); scheduleBlink(); wander(); setTimeout(() => blink(reduceMotion.matches ? 1 : 2, 70), 700); },
      resize() { readSize(); render(); },
      blink,
      lookAtEl,
      think(on) {
        bar.classList.toggle("is-thinking", !!on);          // the gradient border flows faster while it thinks
        if (reduceMotion.matches) return;
        if (on) setMode("thinking"); else { setMode("idle"); wander(); }
      },
      sent(el) {
        if (reduceMotion.matches) return;
        eyes.hopV -= 1.5; eyes.openTarget = 0.5; eyes.glowTarget = 1.15; wake();
        setTimeout(() => { eyes.openTarget = 1.08; wake(); }, 240);
        const r = el.getBoundingClientRect();
        setTimeout(() => { if (mode !== "thinking") lookAtPoint(r.left + r.width / 2, r.top + r.height / 2); }, 120);
      },
      happy(el) {
        if (reduceMotion.matches) return;
        eyes.hopV -= 2.1; eyes.openTarget = 0.42; eyes.glowTarget = 1.25; wake();
        setTimeout(() => { eyes.openTarget = 1.1; wake(); }, 320);
        setTimeout(() => { eyes.openTarget = 1; eyes.glowTarget = 0.85; wake(); }, 1100);
        if (el) { const r = el.getBoundingClientRect(); lookAtPoint(r.left + r.width / 2, r.top + 60); }
      },
      hello() {
        if (reduceMotion.matches) { blink(1, 140); return; }
        eyes.hopV -= 1.1; eyes.openTarget = 1.12; wake();
        setTimeout(() => { eyes.openTarget = 1.05; wake(); }, 260);
        blink(2, 60);
      },
    };
  })();

  /* =========================================================
     6. CHAT BAR WIRING AND LAYOUT
     ========================================================= */

  function syncBar() {
    const hasText = input.value.trim().length > 0;
    bar.classList.toggle("has-text", hasText);
    sendBtn.tabIndex = hasText ? 0 : -1;
    avatarBtn.setAttribute("aria-label", hasText ? "Send" : "Start typing");
  }
  async function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    syncBar();
    syncChips();
    ask(text);
  }
  input.addEventListener("input", () => { syncBar(); syncChips(); });
  bar.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  avatarBtn.addEventListener("click", () => { if (input.value.trim()) submit(); else { input.focus(); face.hello(); } });
  homeBtn.addEventListener("click", () => { goHome(); face.blink(1, 60); });

  // Page Up, Page Down and the arrow keys scroll the conversation, even while the text box has focus
  document.addEventListener("keydown", (e) => {
    if (e.key === "Tab") root.classList.add("keys");
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.target !== input && e.target !== document.body) return;
    const arrows = e.target !== input || !input.value;
    const dy = { PageDown: 0.8, PageUp: -0.8, ArrowDown: arrows ? 0.15 : 0, ArrowUp: arrows ? -0.15 : 0 }[e.key];
    if (!dy) return;
    e.preventDefault();
    page.scrollBy({ top: dy * page.clientHeight, behavior: e.repeat || reduceMotion.matches ? "auto" : "smooth" });
  });
  window.addEventListener("pointerdown", () => root.classList.remove("keys"));

  // keep the bar above the on-screen keyboard (needed on iOS)
  const vv = window.visualViewport;
  function syncViewport() {
    let kb = 0;
    if (vv && vv.scale < 1.01) kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);   // ignore pinch zoom
    if (kb < 60) kb = 0;
    root.style.setProperty("--kb", kb + "px");
    root.classList.toggle("kb-open", kb > 0);
    if (kb > 0) window.scrollTo(0, 0);
    sizeLastTurn();
    // keep the field being edited inside a card above the keyboard
    const a = document.activeElement;
    if (kb > 0 && a && a !== page && page.contains(a)) a.scrollIntoView({ block: "center" });
  }
  if (vv) { vv.addEventListener("resize", syncViewport); vv.addEventListener("scroll", syncViewport); }
  function onResize() { face.resize(); syncBar(); syncViewport(); }
  if (window.ResizeObserver) new ResizeObserver(sizeLastTurn).observe(dock);
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  /* ---- start ---- */
  // the app manifest only works from a web address, so skip it when this is opened as a plain file
  if (location.protocol.indexOf("http") === 0) {
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = "manifest.webmanifest";
    document.head.appendChild(link);
  }
  const now = new Date();
  $("#today").textContent = fmt(now, { weekday: "long", month: "long", day: "numeric" });
  const hour = now.getHours();
  $("#greetingLine").textContent = `Good ${hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening"}, ${MEMBER.first}.`;

  const today = MODULES.today({}, api(null));
  stagger(today);
  today.classList.add("is-built");
  $("#nudge").appendChild(today);

  setChips(HOME_CHIPS);
  onResize();
  face.start();

  // small hook so this can be wired to a real model later
  window.MemberAssistant = { ask, understand, MODULES };
})();
</script>
</body>
</html>
